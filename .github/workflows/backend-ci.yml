name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'scripts/security-repo-scan.sh'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/security-repo-scan.sh'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vhm-finances
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vhm-finances"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vhm-finances?schema=public
      JWT_SECRET: ci_backend_jwt_secret_32_chars_minimum
      JWT_REFRESH_SECRET: ci_backend_refresh_secret_32_chars_minimum
      JWT_EXPIRES_IN: 24h
      SEED_DEFAULT_PASSWORD: TestPassword123!
      CORS_ORIGIN: http://localhost:5173
      COOKIE_SAME_SITE: lax
      PORTAL_URL: http://localhost:5173
      PORTAL_OTP_DELIVERY_MODE: dev
      PORTAL_OTP_TTL_SECONDS: 300
      REDIS_URL: redis://127.0.0.1:6379
      OTEL_ENABLED: 'false'
      RUN_INTEGRATION_TESTS: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Seed data
        run: npm run prisma:seed

      - name: Repository security scan
        run: bash ../scripts/security-repo-scan.sh

      - name: Build + unit + integration tests
        run: npm run check

      - name: Security audit
        run: npm run security:audit
