# Valeurs par défaut pour Kafontine
# Ceci est un fichier YAML formaté, veuillez respecter l'indentation.

# Nom de l'application
nameOverride: ""
fullnameOverride: ""

# Configuration du namespace
namespace:
  create: false
  name: kafontine

# Configuration globale
global:
  environment: production
  domain: kafontine.gouv.sn
  imageRegistry: ""
  imagePullSecrets: []
  existingSecret: ""

# Configuration PostgreSQL (via dependency chart)
postgresql:
  enabled: true
  auth:
    username: postgres
    password: changeme
    database: kafountine
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"

# Configuration Redis (via dependency chart)
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: changeme
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

# Configuration PgBouncer
pgbouncer:
  enabled: true
  replicaCount: 1
  image:
    repository: pgbouncer/pgbouncer
    tag: "1.23.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  service:
    type: ClusterIP
    port: 5432

# Configuration Backend
backend:
  enabled: true
  replicaCount: 3
  image:
    repository: kafontine-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 10
            periodSeconds: 60
  livenessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    path: /ready
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  env:
    NODE_ENV: production
    PORT: "3000"
    JWT_EXPIRES_IN: 15m
    JWT_REFRESH_EXPIRES_IN: 7d
    API_RATE_LIMIT_WINDOW_MS: "60000"
    API_RATE_LIMIT_MAX: "300"
    LOGIN_RATE_LIMIT_WINDOW_MS: "900000"
    LOGIN_RATE_LIMIT_MAX: "5"
    CACHE_ENABLED: "true"
    CACHE_TTL_SECONDS: "300"
    COMPRESSION_ENABLED: "true"
    OTEL_ENABLED: "true"
    OTEL_SERVICE_NAME: kafontine-backend
  secrets:
    DATABASE_URL: ""
    JWT_SECRET: "change-me-min-32-caracteres"
    JWT_REFRESH_SECRET: "change-me-min-32-caracteres"
    REDIS_URL: ""
    CORS_ORIGIN: "https://kafontine.gouv.sn"
    PORTAL_URL: "https://kafontine.gouv.sn"

# Configuration Frontend
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: kafontine-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 101
  env:
    VITE_API_URL: "/api/v1"

# Configuration Ingress
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/ratelimit: "100"
    traefik.ingress.kubernetes.io/compress: "true"
  hosts:
    - host: kafontine.gouv.sn
      paths:
        - path: /api
          pathType: Prefix
          service: backend
          port: 3000
        - path: /health
          pathType: Exact
          service: backend
          port: 3000
        - path: /ready
          pathType: Exact
          service: backend
          port: 3000
        - path: /metrics
          pathType: Exact
          service: backend
          port: 3000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
  tls:
    - secretName: kafontine-tls
      hosts:
        - kafontine.gouv.sn

# Configuration Monitoring
monitoring:
  enabled: true
  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: v2.54.1
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"
    retention: 15d
    storage: 10Gi
    scrapeInterval: 15s
  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: 11.1.4
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "100m"
    adminUser: admin
    adminPassword: change-me

# Configuration des Service Accounts
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Configuration des Pod Security Contexts
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Configuration des Network Policies
networkPolicy:
  enabled: true
  allowIngressFromNamespaceSelector: {}
  allowEgressToInternet: true

# Configuration des Pod Disruption Budgets
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Tolerations et affinités
tolerations: []
affinity: {}
nodeSelector: {}
