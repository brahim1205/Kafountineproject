name: Yearly Maintenance

on:
  schedule:
    - cron: '0 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  create-new-year:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Create current fiscal year
        env:
          API_URL: ${{ secrets.API_URL || 'https://orbyteconsulting.tech' }}
          CRON_API_KEY: ${{ secrets.CRON_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "${API_URL%/}/api/v1/years/auto-create" \
            -H "Authorization: Bearer $CRON_API_KEY" -o response.json
          jq -e '.success == true' response.json
          printf 'Fiscal year creation succeeded at %s\n' "$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
