  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
        <div>
          <h2 class="text-xl font-bold text-gray-900">Déclaration de changement</h2>
          <p class="text-sm text-gray-600 mt-1">{{ moto().matricule }}</p>
        </div>
        <button (click)="closed.emit()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors cursor-pointer">
          <i class="ri-close-line text-xl text-gray-600"></i>
        </button>
      </div>
      <form (submit)="handleSubmit($event)" (input)="clearFieldValidationError($event)" novalidate class="p-6 space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Type de changement</label>
          <div class="grid grid-cols-2 gap-3">
            @for (type of TYPES_CHANGEMENT; track type.value) {
              <label class="flex items-center gap-3 p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-emerald-500 transition-colors">
                <input type="radio" name="typeChangement" [value]="type.value" [checked]="type.value === 'proprietaire'" class="cursor-pointer" />
                <div>
                  <p class="font-medium text-gray-900">{{ type.titre }}</p>
                  <p class="text-xs text-gray-500">{{ type.description }}</p>
                </div>
              </label>
            }
          </div>
        </div>
        <div class="bg-gray-50 rounded-lg p-4">
          <h3 class="font-semibold text-gray-900 mb-3">Informations actuelles</h3>
          <div class="grid grid-cols-2 gap-4 text-sm">
            @for (row of motoSummary(); track $index) {
              @let label = row[0];
              @let personne = row[1];
              <div>
                <p class="text-gray-600">{{ label }}</p>
                <p class="font-medium text-gray-900">{{ personne.nom }}</p>
                <p class="text-gray-500 text-xs">{{ personne.cni }}</p>
              </div>
            }
          </div>
        </div>
        <div>
          <h3 class="font-semibold text-gray-900 mb-3">Nouvelles informations</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <app-field label="Nom complet" name="nouveauNom" [required]="true" placeholder="Nouveau nom"></app-field>
            <app-field label="N° CNI" name="nouveauCNI" [required]="true" placeholder="1234567890123"></app-field>
            <app-field label="Téléphone" name="nouveauTelephone" type="tel" [required]="true" placeholder="77 123 45 67"></app-field>
            <app-field label="N° Permis" name="nouveauPermis" placeholder="A-2024-12345"></app-field>
            <app-field label="Adresse" name="nouvelleAdresse" placeholder="Quartier, Kafountine" class="md:col-span-2"></app-field>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Motif du changement</label>
          <textarea [rows]="3" placeholder="Précisez le motif..." [class]="`${INPUT_CLASS} resize-none`"></textarea>
        </div>
        <app-form-error [message]="error()"></app-form-error>
        <div class="flex gap-3">
          <button type="button" (click)="closed.emit()" class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors whitespace-nowrap cursor-pointer">Annuler</button>
          <button type="submit" [disabled]="isSubmitting()" class="flex-1 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors whitespace-nowrap cursor-pointer disabled:opacity-50">{{ isSubmitting() ? 'Enregistrement...' : 'Enregistrer le changement' }}</button>
        </div>
      </form>
    </div>
  </div>
