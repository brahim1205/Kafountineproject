name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      target_version:
        description: 'Docker image tag to rollback to'
        required: true
      reason:
        description: 'Reason for rollback'
        required: true

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}
  IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME || 'kafontine' }}
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'kafontine' }}
  HELM_RELEASE: ${{ secrets.HELM_RELEASE || 'kafontine' }}
  BACKEND_DEPLOYMENT: ${{ secrets.BACKEND_DEPLOYMENT || 'kafontine-backend' }}
  FRONTEND_DEPLOYMENT: ${{ secrets.FRONTEND_DEPLOYMENT || 'kafontine-frontend' }}

concurrency:
  group: production-rollback
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_DATA}" | base64 -d > "$HOME/.kube/config"
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Rollback with Helm
        run: |
          helm upgrade --install "${HELM_RELEASE}" infra/helm/kafontine \
            --namespace "${K8S_NAMESPACE}" \
            --create-namespace \
            --set frontend.image.repository="${DOCKER_REGISTRY}/${IMAGE_NAME}-frontend" \
            --set frontend.image.tag="${TARGET_VERSION}" \
            --set backend.image.repository="${DOCKER_REGISTRY}/${IMAGE_NAME}-backend" \
            --set backend.image.tag="${TARGET_VERSION}"
        env:
          TARGET_VERSION: ${{ github.event.inputs.target_version }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/"${BACKEND_DEPLOYMENT}" -n "${K8S_NAMESPACE}" --timeout=180s
          kubectl rollout status deployment/"${FRONTEND_DEPLOYMENT}" -n "${K8S_NAMESPACE}" --timeout=180s

      - name: Health Check
        run: |
          curl -f --max-time 30 "${HEALTH_URL}"
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}

      - name: Notify rollback
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Rollback ${{ job.status }} for Kafontine",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Rollback *${{ job.status }}* for Kafontine Municipal\nTarget: `${{ github.event.inputs.target_version }}`\nReason: ${{ github.event.inputs.reason }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
