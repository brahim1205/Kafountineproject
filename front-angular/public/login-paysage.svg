<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Illustration : coucher de soleil sur la côte de Kafountine, pirogues et palmiers.
       Pour utiliser une vraie photo, remplacer ce fichier (même nom) ou changer l'URL dans login.html. -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E97A3"/>
      <stop offset="0.45" stop-color="#A9C3BC"/>
      <stop offset="0.8" stop-color="#F1CFA4"/>
      <stop offset="1" stop-color="#F6DDB9"/>
    </linearGradient>
    <linearGradient id="mer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E9FA2"/>
      <stop offset="0.35" stop-color="#3F7881"/>
      <stop offset="1" stop-color="#173F47"/>
    </linearGradient>
    <linearGradient id="sable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8B98C"/>
      <stop offset="1" stop-color="#B8925F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF2D6" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FBE0B0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F6D3A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#ciel)"/>
  <circle cx="1060" cy="540" r="260" fill="url(#halo)"/>
  <circle cx="1060" cy="548" r="62" fill="#FFF0D2"/>

  <g fill="#FFFFFF" opacity="0.35">
    <ellipse cx="300" cy="170" rx="220" ry="26"/>
    <ellipse cx="420" cy="200" rx="160" ry="18"/>
    <ellipse cx="1250" cy="140" rx="240" ry="24"/>
    <ellipse cx="1120" cy="175" rx="150" ry="16"/>
    <ellipse cx="760" cy="300" rx="190" ry="14"/>
  </g>

  <!-- Côte lointaine -->
  <path d="M0 560 C120 535 220 528 330 540 C430 550 520 532 640 546 C700 552 760 556 800 560 Z" fill="#4F7E77" opacity="0.75"/>
  <path d="M1250 560 C1330 548 1420 540 1600 546 L1600 560 Z" fill="#4F7E77" opacity="0.6"/>

  <rect y="558" width="1600" height="442" fill="url(#mer)"/>

  <!-- Reflet du soleil -->
  <g fill="#FCE6BE">
    <rect x="1010" y="575" width="100" height="4" rx="2" opacity="0.8"/>
    <rect x="985" y="600" width="150" height="4" rx="2" opacity="0.6"/>
    <rect x="1020" y="628" width="90" height="4" rx="2" opacity="0.5"/>
    <rect x="970" y="660" width="170" height="5" rx="2.5" opacity="0.35"/>
    <rect x="1000" y="700" width="120" height="5" rx="2.5" opacity="0.25"/>
  </g>

  <!-- Pirogues au large -->
  <g>
    <path d="M760 640 L900 640 Q880 662 830 664 Q785 662 760 640 Z" fill="#1D3B3A"/>
    <path d="M766 643 L894 643" stroke="#E0A93B" stroke-width="4"/>
    <path d="M772 650 L888 650" stroke="#C4472F" stroke-width="3"/>
    <path d="M1240 610 L1325 610 Q1312 624 1282 625 Q1255 624 1240 610 Z" fill="#1D3B3A"/>
    <path d="M1245 613 L1320 613" stroke="#2E8B57" stroke-width="3"/>
    <path d="M560 600 L620 600 Q612 610 590 611 Q570 610 560 600 Z" fill="#1D3B3A" opacity="0.8"/>
  </g>

  <!-- Plage au premier plan -->
  <path d="M0 800 C220 770 420 790 600 830 C760 866 860 920 940 1000 L0 1000 Z" fill="url(#sable)"/>
  <path d="M0 800 C220 770 420 790 600 830" fill="none" stroke="#F3E6CF" stroke-width="6" opacity="0.7"/>

  <!-- Pirogue tirée sur la plage -->
  <g>
    <path d="M250 860 L560 852 Q520 900 410 904 Q300 902 250 860 Z" fill="#244A45"/>
    <path d="M262 866 L548 859" stroke="#E0A93B" stroke-width="8"/>
    <path d="M272 878 L536 872" stroke="#C4472F" stroke-width="7"/>
    <path d="M288 889 L518 884" stroke="#2E8B57" stroke-width="6"/>
    <path d="M250 860 L232 846 L262 858 Z" fill="#244A45"/>
    <path d="M560 852 L582 836 L552 856 Z" fill="#244A45"/>
  </g>

  <!-- Palmiers -->
  <g fill="#173430" stroke="#173430">
    <path d="M110 1000 C120 880 150 760 205 640" fill="none" stroke-width="16" stroke-linecap="round"/>
    <path d="M205 640 C150 600 90 610 40 650 C100 625 150 628 205 640 Z"/>
    <path d="M205 640 C250 590 320 585 370 610 C315 605 260 615 205 640 Z"/>
    <path d="M205 640 C200 580 170 545 120 530 C165 560 185 595 205 640 Z"/>
    <path d="M205 640 C240 600 270 560 275 520 C255 565 230 600 205 640 Z"/>
    <path d="M205 640 C150 650 110 690 90 740 C125 700 160 670 205 640 Z"/>
    <path d="M205 640 C260 650 300 690 315 735 C285 698 250 670 205 640 Z"/>

    <path d="M20 1000 C30 900 40 820 70 740" fill="none" stroke-width="12" stroke-linecap="round"/>
    <path d="M70 740 C30 710 -10 715 -40 740 C0 725 35 728 70 740 Z"/>
    <path d="M70 740 C105 705 150 700 185 720 C150 718 110 725 70 740 Z"/>
    <path d="M70 740 C68 700 50 675 20 665 C45 690 60 712 70 740 Z"/>
    <path d="M70 740 C110 752 135 780 145 812 C125 787 100 765 70 740 Z"/>
  </g>

  <!-- Mangrove à droite -->
  <g fill="#173430">
    <path d="M1360 1000 C1380 900 1450 860 1530 850 C1570 846 1600 852 1600 852 L1600 1000 Z"/>
    <ellipse cx="1470" cy="860" rx="120" ry="48"/>
    <ellipse cx="1560" cy="830" rx="90" ry="50"/>
    <ellipse cx="1400" cy="900" rx="80" ry="36"/>
  </g>
</svg>
