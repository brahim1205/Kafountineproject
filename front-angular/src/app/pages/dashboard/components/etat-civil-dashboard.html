  <div class="space-y-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">État civil</h1>
      <p class="text-sm text-gray-600 mt-1">Vos demandes et vos taxes au même endroit</p>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      @for (card of cards(); track card.label) {
        <a [routerLink]="card.to" class="bg-white rounded-xl border border-gray-200 p-5 flex items-center gap-4 hover:border-gray-300">
          <div [class]="`w-11 h-11 rounded-lg flex items-center justify-center ${card.color}`">
            <i [class]="`${card.icon} text-xl`"></i>
          </div>
          <div>
            <p class="text-sm text-gray-600">{{ card.label }}</p>
            <p class="text-2xl font-bold text-gray-900">{{ Number(card.value || 0).toLocaleString('fr-FR') }}</p>
          </div>
        </a>
      }
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      @for (action of ACTIONS; track action.to) {
        <a [routerLink]="action.to" [class]="`rounded-xl p-4 flex items-center gap-3 text-sm font-medium transition-colors ${action.color}`">
          <i [class]="`${action.icon} text-xl`"></i>{{ action.label }}</a>
      }
    </div>
    <div>
      <h2 class="text-lg font-semibold text-gray-900 mb-3">Demandes à traiter</h2>
      <app-historique-demandes statut="EN_ATTENTE" (changed)="load()"></app-historique-demandes>
    </div>
  </div>
