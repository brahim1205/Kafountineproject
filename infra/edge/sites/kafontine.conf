# Kafountine Gestion municipale — orbyteconsulting.tech.
# Certificat : /opt/edge/certs/orbyteconsulting.tech, renouvelé par certbot (webroot /opt/edge/certbot/www,
# hook /etc/letsencrypt/renewal-hooks/deploy/renew-orbyte-kafontine, voir install.sh).
# Application : conteneur kafontine-front-prod, publié sur l'interface docker0 de l'hôte (FRONT_PORT=172.17.0.1:8081).

server {
  listen 8080;
  server_name orbyteconsulting.tech www.orbyteconsulting.tech;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://orbyteconsulting.tech$request_uri;
  }
}

server {
  listen 127.0.0.1:8444 ssl proxy_protocol;
  http2 on;
  server_name www.orbyteconsulting.tech;

  ssl_certificate /etc/nginx/certs/orbyteconsulting.tech/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/orbyteconsulting.tech/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://orbyteconsulting.tech$request_uri;
}

server {
  listen 127.0.0.1:8444 ssl proxy_protocol;
  http2 on;
  server_name orbyteconsulting.tech;

  # Adresse réelle du client, transmise par le bloc stream de nginx.conf.
  set_real_ip_from 127.0.0.1;
  real_ip_header proxy_protocol;

  ssl_certificate /etc/nginx/certs/orbyteconsulting.tech/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/orbyteconsulting.tech/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:kafontine_ssl:10m;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 20m;

  location / {
    proxy_pass http://kafontine-front:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Création / restauration d'une sauvegarde complète : plus d'une minute à pleine charge.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }
}
