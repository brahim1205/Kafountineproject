name: Frontend CI

on:
  push:
    paths:
      - 'front/**'
      - 'scripts/security-repo-scan.sh'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'front/**'
      - 'scripts/security-repo-scan.sh'
      - '.github/workflows/frontend-ci.yml'

env:
  NODE_VERSION: '22'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front

      - name: Run ESLint
        run: npm run lint
        working-directory: front

      - name: Run TypeScript type check
        run: npm run type-check
        working-directory: front

      - name: Build for production
        run: npm run build
        working-directory: front

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: front/out
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front

      - name: Run tests
        run: npm run test:run
        working-directory: front

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: front/coverage
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front

      - name: Repository security scan
        run: bash ./scripts/security-repo-scan.sh

      - name: Run npm audit
        run: npm audit --audit-level=high
        working-directory: front

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile.prod
          push: false
          tags: kafontine-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Verify image builds successfully
        run: docker images | grep kafontine-frontend
