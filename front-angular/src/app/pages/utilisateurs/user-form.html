  <form (submit)="submitted.emit($event)" (input)="clearFieldValidationError($event)" novalidate class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <app-field label="Nom complet" name="name" [required]="true" [defaultValue]="defaultValues()?.name"></app-field>
      <app-field label="Email" name="email" type="email" [required]="true" [defaultValue]="defaultValues()?.email"></app-field>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <app-field label="Téléphone" name="phone" [defaultValue]="defaultValues()?.phone"></app-field>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Rôle</label>
        <select name="role" [value]="defaultValues()?.role || 'AGENT'" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none text-sm cursor-pointer">
          @for (role of roleOptions(); track role) {
            <option [value]="role">
              {{ ROLE_LABELS[role] || role }}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <app-field label="Mot de passe" name="password" type="password" [required]="requirePassword()" [minLength]="12" autoComplete="new-password"></app-field>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Statut</label>
        <select name="status" [value]="defaultValues()?.status || 'Actif'" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none text-sm cursor-pointer">
          <option>Actif</option>
          <option>Inactif</option>
        </select>
      </div>
    </div>
    <div class="flex justify-end gap-3 pt-2">
      <button type="button" (click)="cancelled.emit()" class="px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-100 rounded-lg transition-colors whitespace-nowrap">Annuler</button>
      <button type="submit" class="px-4 py-2.5 bg-emerald-600 text-white text-sm font-medium rounded-lg hover:bg-emerald-700 transition-colors whitespace-nowrap">Enregistrer</button>
    </div>
  </form>
