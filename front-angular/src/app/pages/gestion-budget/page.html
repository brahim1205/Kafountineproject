@let activeModal = modal();
  <div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Gestion du Budget</h1>
        <p class="text-sm text-gray-600 mt-1">Vue d'ensemble des lignes budgétaires - Année
          {{ selectedYear() }}</p>
      </div>
      <button (click)="modal.set({ type: 'create' })" class="flex items-center gap-2 px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 transition-colors">
        <i class="ri-add-line"></i>Nouvelle Ligne</button>
    </div>
    <app-budget-summary [totalPrevu]="totalPrevu()" [totalDepenses]="totalDepenses()"></app-budget-summary>
    <app-budget-table [canDelete]="canDelete()" [lignes]="lignes()" [loading]="loading()" [year]="selectedYear()" [busy]="deleting()" (edit)="modal.set({ type: 'edit', ligne: $event })" (view)="modal.set({ type: 'view', ligne: $event })" (delete)="canDelete() && handleDelete($event)"></app-budget-table>
  </div>
  @if (activeModal?.type === 'create') {
    <app-ligne-form-modal (closed)="modal.set(null)" (submitted)="handleCreate($event)"></app-ligne-form-modal>
  }
  @if (activeModal?.type === 'edit') {
    <app-ligne-form-modal [ligne]="activeModal.ligne" (closed)="modal.set(null)" (submitted)="handleUpdate(activeModal.ligne)($event)"></app-ligne-form-modal>
  }
  @if (activeModal?.type === 'view') {
    <app-ligne-detail-modal [ligne]="activeModal.ligne" (closed)="modal.set(null)"></app-ligne-detail-modal>
  }
