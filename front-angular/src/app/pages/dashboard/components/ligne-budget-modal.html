  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-md">
      <div class="p-6 border-b border-gray-200">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-gray-900">Nouvelle Ligne Budgétaire</h3>
          <button aria-label="Fermer" (click)="closed.emit()" class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
            <i class="ri-close-line text-xl"></i>
          </button>
        </div>
      </div>
      <div class="p-6 space-y-4">
        <form (submit)="submitted.emit($event)" (input)="clearFieldValidationError($event)" novalidate class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Code budgétaire</label>
            <input aria-label="Code budgétaire" type="text" data-required="true" [value]="ligne().code" (input)="onCodeChange($event)" placeholder="Ex: 601" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none text-sm" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Libellé</label>
            <input aria-label="Libellé" type="text" data-required="true" [value]="ligne().libelle" (input)="onLibelleChange($event)" placeholder="Ex: Salaires & Indemnités" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none text-sm" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Montant prévu (FCFA)</label>
            <input aria-label="Montant prévu (FCFA)" type="number" data-required="true" min="0" [value]="ligne().prevu || ''" (input)="onPrevuChange($event)" placeholder="Ex: 5000000" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none text-sm" />
          </div>
          <div class="flex justify-end gap-3 pt-4">
            <button type="button" (click)="closed.emit()" class="px-4 py-2 text-gray-700 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors">Annuler</button>
            <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 transition-colors">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  </div>
