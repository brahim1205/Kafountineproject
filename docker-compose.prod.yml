# Docker Compose - Production
# Use: docker-compose -f docker-compose.prod.yml up -d

name: kafontine-prod

services:
  postgres:
    image: postgres:16
    container_name: kafontine-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kafontine-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile.prod
    container_name: kafontine-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      REDIS_URL: ${REDIS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      ENABLE_METRICS: ${ENABLE_METRICS:-false}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-120}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-kafountine-backend}
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: kafontine-front-prod
    restart: always
    environment:
      NGINX_BACKEND_URL: http://backend:3000
    ports:
      - "${FRONT_PORT}:8080"
    depends_on:
      - backend

volumes:
  postgres_prod_data:
  backend_uploads:
