  <div>
    <form (submit)="handleSubmit($event)" (input)="clearFieldValidationError($event)" novalidate class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-2">Type de document
            <span class="text-red-500">*</span>
          </label>
          <select aria-label="Type de document" data-required="true" [value]="typeDocument()" (change)="typeDocument.set($any($event.target).value)" class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            <option value="">Sélectionnez un type de document</option>
            @for (doc of typesDocuments(); track doc.id) {
              <option [value]="doc.id">{{ doc.nom }}
                -
                {{ doc.tarif }}
                FCFA</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Nom complet
            <span class="text-red-500">*</span>
          </label>
          <input aria-label="Nom complet" type="text" name="nomComplet" data-required="true" placeholder="Ex: Mamadou Diallo" [value]="formData().nomComplet" (input)="onNomCompletChange($event)" class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Numéro CNI
            <span class="text-red-500">*</span>
          </label>
          <input aria-label="Numéro CNI" type="text" name="cni" data-required="true" placeholder="Ex: 1234567890123" [maxLength]="13" [value]="formData().cni" (input)="onCniChange($event)" class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Téléphone
            <span class="text-red-500">*</span>
          </label>
          <input aria-label="Téléphone" type="tel" name="telephone" data-required="true" placeholder="Ex: 77 123 45 67" [value]="formData().telephone" (input)="onTelephoneChange($event)" class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Adresse</label>
          <input aria-label="Adresse" type="text" name="adresse" placeholder="Ex: Quartier Nord, Kafountine" [value]="formData().adresse" (input)="onAdresseChange($event)" class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Nombre d'exemplaires
            <span class="text-red-500">*</span>
          </label>
          <input aria-label="Nombre d'exemplaires" type="number" name="exemplaires" data-required="true" min="1" [value]="formData().exemplaires" (input)="onExemplairesChange($event)" class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Mode de paiement
            <span class="text-red-500">*</span>
          </label>
          <select aria-label="Mode de paiement" name="modePaiement" data-required="true" class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            <option value="especes">Espèces</option>
            <option value="mobile">Mobile Money</option>
            <option value="cheque">Chèque</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-2">Observations</label>
          <textarea aria-label="Observations" name="observations" [rows]="3" placeholder="Notes ou informations complémentaires..." [value]="formData().observations" (input)="onObservationsChange($event)" class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 resize-none"></textarea>
        </div>
      </div>
      @if (selectedDoc()) {
        <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-4">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm font-medium text-gray-700">Montant à payer</p>
              <p class="text-xs text-gray-600 mt-0.5">{{ selectedDoc()!.nom }}
                ×
                {{ formData().exemplaires }}</p>
            </div>
            <p class="text-2xl font-bold text-emerald-600">{{ (selectedDoc()!.tarif * formData().exemplaires).toLocaleString() }}
              FCFA</p>
          </div>
        </div>
      }
      <div class="flex gap-3">
          <button type="button" (click)="success.emit()" class="px-6 py-3 border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors">Annuler</button>
        <button type="submit" [disabled]="isSubmitting()" [class]="`flex-1 px-6 py-3 text-white text-sm font-medium rounded-lg ${isSubmitting() ? 'bg-gray-400 cursor-not-allowed' : 'bg-emerald-500 hover:bg-emerald-600 transition-colors'}`">
          <i [class]="`ri-${isSubmitting() ? 'loader-4-line animate-spin' : 'check-line'} mr-2`"></i>{{ isSubmitting() ? 'Enregistrement...' : 'Valider et générer le document' }}</button>
      </div>
      @if (error()) {
        <div class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-700 text-sm">
          <i class="ri-error-warning-line mr-2"></i>{{ error() }}</div>
      }
    </form>
    @if (showRecuPDF() && transactionData()) {
      <app-recu-pdf [transaction]="transactionData()!" (closed)="showRecuPDF.set(false); resetForm(); success.emit()"></app-recu-pdf>
    }
  </div>
