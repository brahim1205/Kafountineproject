  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-md">
      <div class="p-6 border-b border-gray-200">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-gray-900">Nouvelle Demande de Dépense</h3>
          <button aria-label="Fermer" (click)="closed.emit()" class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
            <i class="ri-close-line text-xl"></i>
          </button>
        </div>
      </div>
      <div class="p-6 space-y-4">
        <form (submit)="submitted.emit($event)" (input)="clearFieldValidationError($event)" novalidate class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Service demandeur</label>
            <select aria-label="Service demandeur" data-required="true" [value]="depense().service" (change)="onServiceChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none text-sm">
              <option value="">Sélectionner un service</option>
              <option value="Urbanisme">Urbanisme</option>
              <option value="Motos">Motos</option>
              <option value="Marché">Marché</option>
              <option value="Formations">Formations</option>
              <option value="Administration">Administration</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Description de la dépense</label>
            <textarea aria-label="Description de la dépense" data-required="true" [rows]="3" [value]="depense().description" (input)="onDescriptionChange($event)" placeholder="Décrire la dépense..." class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none text-sm resize-none"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Montant (FCFA)</label>
            <input aria-label="Montant (FCFA)" type="number" data-required="true" min="0" [value]="depense().montant || ''" (input)="onMontantChange($event)" placeholder="Ex: 150000" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none text-sm" />
          </div>
          <div class="flex justify-end gap-3 pt-4">
            <button type="button" (click)="closed.emit()" class="px-4 py-2 text-gray-700 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors">Annuler</button>
            <button type="submit" class="px-4 py-2 bg-amber-600 text-white rounded-lg text-sm font-medium hover:bg-amber-700 transition-colors">Soumettre la demande</button>
          </div>
        </form>
      </div>
    </div>
  </div>
