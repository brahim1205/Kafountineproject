# Proxy frontal partagé du serveur, installé dans /opt/edge (voir README.md).
# Projet Compose indépendant : ni le déploiement de c2p ni celui de Kafountine n'y touchent.
name: edge

services:
  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: edge-proxy
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    extra_hosts:
      # Kafountine est publiée sur l'interface docker0 de l'hôte (FRONT_PORT=172.17.0.1:8081).
      - "kafontine-front:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sites:/etc/nginx/sites:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - edge
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0755
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    external: true
    name: edge
