<div class="space-y-5">
  <div class="grid grid-cols-1 gap-5 sm:grid-cols-3">
    @for (card of cards(); track card.label) {
      <div class="rounded-xl border border-gray-200 bg-white p-6">
        <p class="mb-1 text-sm text-gray-600">{{ card.label }}</p>
        <p class="text-2xl font-bold text-gray-900">{{ card.value }}</p>
        <p class="mt-1 text-xs text-gray-500">{{ card.unit }}</p>
      </div>
    }
  </div>

  @if (repartition().length) {
    <section class="rounded-xl border border-gray-200 bg-white p-6" aria-labelledby="titre-repartition">
      <h2 id="titre-repartition" class="mb-4 text-base font-semibold text-gray-900">Répartition par catégorie</h2>
      <ul class="grid grid-cols-1 gap-x-10 gap-y-3 md:grid-cols-2">
        @for (cat of repartition(); track cat.nom) {
          <li>
            <div class="flex items-center justify-between gap-3 text-sm">
              <span class="truncate text-gray-700">{{ cat.nom }}</span>
              <span class="whitespace-nowrap font-medium tabular-nums text-gray-900">{{ cat.montant.toLocaleString('fr-FR') }} FCFA</span>
            </div>
            <div class="mt-1 h-2 w-full rounded-full bg-gray-100" aria-hidden="true">
              <div class="h-2 rounded-full bg-emerald-600" [style.width.%]="cat.largeur"></div>
            </div>
          </li>
        }
      </ul>
    </section>
  }
</div>
