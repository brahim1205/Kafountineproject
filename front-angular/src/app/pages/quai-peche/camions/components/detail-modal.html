  <app-modal [title]="kind() === 'camion' ? 'Détails du camion' : 'Détails de l\'expédition'" (closed)="closed.emit()" [footerSlot]="true">
    <ng-container ngProjectAs="[slot-footer]">
      <button (click)="closed.emit()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200">Fermer</button>
      @if (editable()) {
        <button (click)="enregistrerStatut()" [disabled]="saving() || statut() === item().statut" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 disabled:opacity-60">{{ saving() ? 'Enregistrement...' : 'Mettre à jour le statut' }}</button>
      }
    </ng-container>
    <dl class="space-y-3">
      @for (row of rows(); track $index) {
        @let label = row[0];
        @let value = row[1];
        <div class="flex justify-between gap-4">
          <dt class="text-gray-500">{{ label }}</dt>
          <dd class="font-medium text-right">{{ value }}</dd>
        </div>
      }
    </dl>
    @if (kind() === 'expedition') {
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Statut</label>
        <select aria-label="Statut" [value]="statut()" (change)="statut.set($any($event.target).value)" [disabled]="!editable()" [class]="INPUT_CLASS">
          @for (row of Object.entries(STATUTS_EXPEDITION); track $index) {
            @let value = row[0];
            @let label = row[1].label;
            <option [value]="value">{{ label }}</option>
          }
          @if (!STATUTS_EXPEDITION[item().statut]) {
            <option [value]="item().statut">{{ item().statut }}</option>
          }
        </select>
      </div>
    }
    @if (error()) {
      <p class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-3">{{ error() }}</p>
    }
  </app-modal>
