apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafontine.fullname" . }}-config
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    {{- include "kafontine.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.frontend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
---
{{- if not .Values.global.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafontine.secretName" . }}
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    {{- include "kafontine.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "kafontine.backend.databaseUrl" . | quote }}
  JWT_SECRET: {{ .Values.backend.secrets.JWT_SECRET | quote }}
  JWT_REFRESH_SECRET: {{ .Values.backend.secrets.JWT_REFRESH_SECRET | quote }}
  REDIS_URL: {{ include "kafontine.backend.redisUrl" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | quote }}
  CORS_ORIGIN: {{ .Values.backend.secrets.CORS_ORIGIN | quote }}
  PORTAL_URL: {{ .Values.backend.secrets.PORTAL_URL | quote }}
  PORTAL_OTP_TTL_SECONDS: {{ .Values.backend.secrets.PORTAL_OTP_TTL_SECONDS | quote }}
  PORTAL_OTP_DELIVERY_MODE: {{ .Values.backend.secrets.PORTAL_OTP_DELIVERY_MODE | quote }}
  PORTAL_OTP_WEBHOOK_URL: {{ .Values.backend.secrets.PORTAL_OTP_WEBHOOK_URL | quote }}
  PORTAL_OTP_WEBHOOK_TOKEN: {{ .Values.backend.secrets.PORTAL_OTP_WEBHOOK_TOKEN | quote }}
  METRICS_BEARER_TOKEN: {{ .Values.backend.secrets.METRICS_BEARER_TOKEN | quote }}
---
{{- end }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kafontine.serviceAccountName" . }}
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    {{- include "kafontine.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if and .Values.monitoring.enabled .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafontine.grafanaSecretName" . }}
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    app.kubernetes.io/component: grafana
    {{- include "kafontine.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.monitoring.grafana.adminUser | quote }}
  admin-password: {{ .Values.monitoring.grafana.adminPassword | quote }}
{{- end }}
---
{{- if .Values.pgbouncer.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafontine.pgbouncerAuthSecretName" . }}
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    app.kubernetes.io/component: pgbouncer
    {{- include "kafontine.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.txt: |
    "{{ .Values.postgresql.auth.username }}" "{{ .Values.postgresql.auth.password }}"
{{- end }}
