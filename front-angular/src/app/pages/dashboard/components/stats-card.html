  <div class="bg-white rounded-xl p-6 border border-gray-200 hover:shadow-lg transition-shadow">
    <div class="flex items-start justify-between">
      <div class="flex-1">
        <p class="text-sm text-gray-600 mb-1">{{ title() }}</p>
        <div class="flex items-baseline gap-2">
          <h3 class="text-2xl font-bold text-gray-900">{{ value() }}</h3>
          <span class="text-sm text-gray-500">{{ unit() }}</span>
        </div>
        <div [class]="`inline-flex items-center gap-1 mt-3 px-2 py-1 rounded-full text-xs font-medium ${trendColors()[trend()]}`">
          <i [class]="trendIcons()[trend()]"></i>
          <span>{{ change() }}</span>
        </div>
      </div>
      <div [class]="`w-12 h-12 rounded-lg ${colorClasses()[color()]} flex items-center justify-center`">
        <i [class]="`${icon()} text-2xl`"></i>
      </div>
    </div>
  </div>
