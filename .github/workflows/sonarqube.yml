name: SonarQube

on:
  push:
    branches:
      - main
    paths:
      - 'backend-spring/**'
      - 'database/**'
      - 'front-angular/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonarqube.yml'
  pull_request:
    paths:
      - 'backend-spring/**'
      - 'database/**'
      - 'front-angular/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonarqube.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check SonarQube secrets
        id: sonar-check
        run: |
          if [ -n "${SONAR_TOKEN}" ] && [ -n "${SONAR_HOST_URL}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube secrets are not configured. Skipping scan."
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Checkout code
        if: steps.sonar-check.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.sonar-check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: front-angular/package-lock.json

      - name: Install frontend dependencies
        if: steps.sonar-check.outputs.enabled == 'true'
        run: npm ci
        working-directory: front-angular

      - uses: actions/setup-java@v4
        if: steps.sonar-check.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend
        if: steps.sonar-check.outputs.enabled == 'true'
        run: mvn -q -Dmaven.test.skip=true package
        working-directory: backend-spring

      - name: Lint frontend
        if: steps.sonar-check.outputs.enabled == 'true'
        run: npm run lint
        working-directory: front-angular

      - name: Build frontend
        if: steps.sonar-check.outputs.enabled == 'true'
        run: npm run build
        working-directory: front-angular

      - name: Run frontend tests with coverage
        if: steps.sonar-check.outputs.enabled == 'true'
        run: npm test -- --watch=false --coverage --coverage-reporters=lcov
        working-directory: front-angular

      - name: SonarQube Scan
        if: steps.sonar-check.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
