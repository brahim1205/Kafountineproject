{{- if and .Values.monitoring.enabled .Values.monitoring.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafontine.fullname" . }}-prometheus-config
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    app.kubernetes.io/component: prometheus
    {{- include "kafontine.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: kafontine-backend
        metrics_path: /metrics
        static_configs:
          - targets: ['{{ include "kafontine.fullname" . }}-backend:{{ .Values.backend.service.port }}']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafontine.fullname" . }}-prometheus
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    app.kubernetes.io/component: prometheus
    {{- include "kafontine.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: prometheus
      {{- include "kafontine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: prometheus
        {{- include "kafontine.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image.repository }}:{{ .Values.monitoring.prometheus.image.tag }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retention }}
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            {{- toYaml .Values.monitoring.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kafontine.fullname" . }}-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafontine.fullname" . }}-prometheus
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    app.kubernetes.io/component: prometheus
    {{- include "kafontine.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: prometheus
    {{- include "kafontine.selectorLabels" . | nindent 4 }}
{{- end }}
---
{{- if and .Values.monitoring.enabled .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafontine.fullname" . }}-grafana-provisioning
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    app.kubernetes.io/component: grafana
    {{- include "kafontine.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "kafontine.fullname" . }}-prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Kafontine
        orgId: 1
        folder: Kafontine
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafontine.fullname" . }}-grafana-dashboard
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    app.kubernetes.io/component: grafana
    {{- include "kafontine.labels" . | nindent 4 }}
data:
  kafontine-backend.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Backend Up",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "targets": [{ "expr": "kafontine_backend_up", "refId": "A" }]
        },
        {
          "title": "Uptime Seconds",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 0 },
          "targets": [{ "expr": "kafontine_backend_uptime_seconds", "refId": "A" }]
        },
        {
          "title": "RSS Memory",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [{ "expr": "kafontine_backend_memory_rss_bytes", "refId": "A" }]
        },
        {
          "title": "Heap Used",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [{ "expr": "kafontine_backend_heap_used_bytes", "refId": "A" }]
        }
      ],
      "schemaVersion": 39,
      "tags": ["kafontine", "backend"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "title": "Kafontine Backend",
      "uid": "kafontine-backend",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafontine.fullname" . }}-grafana
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    app.kubernetes.io/component: grafana
    {{- include "kafontine.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
      {{- include "kafontine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
        {{- include "kafontine.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafana.image.repository }}:{{ .Values.monitoring.grafana.image.tag }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "kafontine.grafanaSecretName" . }}
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kafontine.grafanaSecretName" . }}
                  key: admin-password
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/kafontine-backend.json
              subPath: kafontine-backend.json
          resources:
            {{- toYaml .Values.monitoring.grafana.resources | nindent 12 }}
      volumes:
        - name: provisioning
          configMap:
            name: {{ include "kafontine.fullname" . }}-grafana-provisioning
        - name: dashboard
          configMap:
            name: {{ include "kafontine.fullname" . }}-grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafontine.fullname" . }}-grafana
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    app.kubernetes.io/component: grafana
    {{- include "kafontine.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: grafana
    {{- include "kafontine.selectorLabels" . | nindent 4 }}
{{- end }}
