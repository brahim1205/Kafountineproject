  <div class="fixed inset-0 bg-gray-900/50 z-50" (click)="closed.emit()" aria-hidden="true"></div>
  <div class="fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl">
        <div class="flex items-center justify-between p-6 border-b border-gray-200">
          <div>
            <h2 class="text-xl font-bold text-gray-900">Inscrire un jeune</h2>
            @if (selectedFormation()) {
              <p class="text-sm text-emerald-600 mt-1 flex items-center gap-1">
                <i class="ri-book-line"></i>{{ selectedFormation()!.nom }}</p>
            }
          </div>
          <button (click)="closed.emit()" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-600 rounded-lg hover:bg-gray-100 transition-colors cursor-pointer" aria-label="Fermer">
            <i class="ri-close-line text-xl"></i>
          </button>
        </div>
        <form (submit)="handleSubmit($event)" (input)="clearFieldValidationError($event)" novalidate class="p-6">
          @if (errorMsg()) {
            <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ errorMsg() }}</div>
          }
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">Formation *</label>
              <select data-required="true" [value]="formData().formationId" (change)="onFormationIdChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm cursor-pointer">
                <option value="">Sélectionner une formation</option>
                @for (formation of formationsActives(); track formation.id) {
                  <option [value]="formation.id">{{ formation.nom }}
                    ({{ formation.nombreInscrits }}
                    inscrits)</option>
                }
              </select>
              @if (formationsActives().length === 0) {
                <p class="text-xs text-red-500 mt-1">Aucune formation en cours disponible. Créez d'abord une formation.</p>
              }
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Prénom *</label>
              <input type="text" data-required="true" [value]="formData().prenom" (input)="onPrenomChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm" placeholder="Prénom" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Nom *</label>
              <input type="text" data-required="true" [value]="formData().nom" (input)="onNomChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm" placeholder="Nom de famille" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">CNI *</label>
              <input type="text" data-required="true" [value]="formData().cni" (input)="onCniChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm" placeholder="1234567890123" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Téléphone *</label>
              <input type="tel" data-required="true" [value]="formData().telephone" (input)="onTelephoneChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-5

0 focus:border-transparent text-sm" placeholder="771234567" />
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">Adresse *</label>
              <input type="text" data-required="true" [value]="formData().adresse" (input)="onAdresseChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm" placeholder="Quartier, Kafountine" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Niveau d’étude *</label>
              <select data-required="true" [value]="formData().niveauEtude" (change)="onNiveauEtudeChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm cursor-pointer">
                <option value="">Sélectionner</option>
                <option value="Aucun">Aucun</option>
                <option value="Primaire">Primaire</option>
                <option value="Collège">Collège</option>
                <option value="Lycée">Lycée</option>
                <option value="Supérieur">Supérieur</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Sexe *</label>
              <select data-required="true" [value]="formData().sexe" (change)="onSexeChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm cursor-pointer">
                <option value="">Sélectionner</option>
                <option value="M">Masculin</option>
                <option value="F">Féminin</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Date de naissance *</label>
              <input type="date" data-required="true" [value]="formData().dateNaissance" (input)="onDateNaissanceChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Photo</label>
              <input type="file" accept="image/*" (change)="onFileChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm" />
            </div>
          </div>
          <div class="flex gap-3 mt-6">
            <button type="button" (click)="closed.emit()" class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors whitespace-nowrap cursor-pointer">Annuler</button>
            <button type="submit" [disabled]="formationsActives().length === 0" class="flex-1 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors whitespace-nowrap cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
              <i class="ri-user-add-line mr-1"></i>Inscrire le jeune</button>
          </div>
        </form>
      </div>
    </div>
  </div>
