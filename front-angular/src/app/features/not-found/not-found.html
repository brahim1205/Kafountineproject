<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
      <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-emerald-50 rounded-full blur-3xl opacity-50"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-blue-50 rounded-full blur-3xl opacity-50"></div>
      </div>

      <div class="relative max-w-2xl w-full text-center">
        <div class="relative mb-8">
          <h1 class="text-[10rem] md:text-[15rem] font-black text-gray-100 leading-none select-none">
            404
          </h1>
          <div class="absolute inset-0 flex items-center justify-center">
            <div class="p-4 bg-white/40 backdrop-blur-md rounded-2xl border border-white/50 shadow-xl">
              <i class="ri-map-pin-user-line text-6xl text-emerald-600 animate-bounce"></i>
            </div>
          </div>
        </div>

        <div class="space-y-6">
          <h2 class="text-3xl md:text-4xl font-black text-gray-900 tracking-tight">
            Oups ! Vous semblez perdu...
          </h2>
          <p class="text-gray-500 text-lg max-w-md mx-auto leading-relaxed">
            La page que vous recherchez à l'adresse <span class="font-mono text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded text-sm">{{ path }}</span> n'existe pas ou a été déplacée.
          </p>
          
          <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
            <a routerLink="/"
              class="px-8 py-3 bg-emerald-600 text-white font-bold rounded-2xl hover:bg-emerald-700 hover:scale-105 transition-all shadow-lg shadow-emerald-600/20 flex items-center gap-2 group"
            >
              <i class="ri-home-4-line text-lg group-hover:-translate-y-0.5 transition-transform"></i>
              Retour à l'accueil
            </a>
            <button 
              (click)="back()" type="button"
              class="px-8 py-3 bg-white text-gray-700 font-bold rounded-2xl border border-gray-200 hover:bg-gray-50 hover:scale-105 transition-all shadow-sm flex items-center gap-2"
            >
              <i class="ri-arrow-left-line text-lg"></i>
              Page précédente
            </button>
          </div>
        </div>

        <div class="mt-16 pt-8 border-t border-gray-200/50 flex flex-col items-center gap-2">
          <div class="flex items-center gap-2 opacity-40 grayscale grayscale-100">
            <img src="/logo.jpeg" alt="Logo" class="w-6 h-6 object-contain" />
            <span class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-900">Commune de Kafountine</span>
          </div>
          <p class="text-[10px] text-gray-400 font-medium italic">Plateforme de Gestion Municipale Intégrée</p>
        </div>
      </div>
    </div>
