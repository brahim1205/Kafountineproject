name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'front-angular/e2e/**'
      - 'front-angular/src/**'
      - 'front-angular/playwright.config.ts'
      - 'front-angular/package.json'
      - 'front-angular/package-lock.json'
      - 'backend-spring/**'
      - 'database/**'
      - 'scripts/security-repo-scan.sh'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'front-angular/e2e/**'
      - 'front-angular/src/**'
      - 'front-angular/playwright.config.ts'
      - 'front-angular/package.json'
      - 'front-angular/package-lock.json'
      - 'backend-spring/**'
      - 'database/**'
      - 'scripts/security-repo-scan.sh'
      - '.github/workflows/e2e.yml'

env:
  NODE_VERSION: '22'

jobs:
  e2e-tests:
    # Image figée : ubuntu-latest est passé à Ubuntu 26.04, que Playwright ne prend pas encore en charge.
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vhm-finances?schema=public
      JWT_SECRET: ci_e2e_jwt_secret_32_chars_minimum_value
      JWT_REFRESH_SECRET: ci_e2e_refresh_secret_32_chars_minimum
      SEED_DEFAULT_PASSWORD: TestPassword123!
      CORS_ORIGIN: http://127.0.0.1:5174
      COOKIE_SAME_SITE: lax
      REDIS_URL: redis://127.0.0.1:6379
      # La suite se connecte des dizaines de fois depuis la même IP : on lève la limite anti-bruteforce en test.
      LOGIN_RATE_LIMIT_MAX: 1000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vhm-finances
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vhm-finances"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            front-angular/package-lock.json
            database/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front-angular

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: front-angular

      - name: Build frontend
        run: npm run build
        working-directory: front-angular

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start backend for testing
        run: |
          (cd database && npm ci && npx prisma generate && npx prisma migrate deploy && npm run prisma:seed)
          (cd backend-spring && mvn -q -Dmaven.test.skip=true package)
          nohup java -jar backend-spring/target/*.jar > /tmp/kafontine-backend.log 2>&1 &

      - name: Repository security scan
        run: bash ./scripts/security-repo-scan.sh

      - name: Wait for backend
        run: |
          sleep 10
          for i in {1..30}; do
            if curl -f http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start. Last logs:" >&2
          tail -n 200 /tmp/kafontine-backend.log >&2 || true
          exit 1

      - name: Run E2E tests
        run: npx playwright test
        working-directory: front-angular
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front-angular/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: front-angular/test-results/
          retention-days: 14
