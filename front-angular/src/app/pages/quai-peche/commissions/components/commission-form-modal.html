  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-lg">
      <div class="p-6 border-b border-gray-200">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-gray-900">Nouvelle Commission Frigorifique</h3>
          <button (click)="closed.emit()" class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg">
            <i class="ri-close-line text-xl"></i>
          </button>
        </div>
      </div>
      <form (submit)="submitted.emit($event)" (input)="clearFieldValidationError($event)" novalidate>
        <div class="p-6 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Pêcheur *</label>
            <select data-required="true" [value]="formData().pecheurId" (change)="onPecheurIdChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500">
              <option value="">Sélectionner un pêcheur</option>
              @for (p of pecheurs(); track p.id) {
                <option [value]="p.id">{{ p.prenom }}&ngsp;{{ p.nom }}</option>
              }
            </select>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Poids (kg) *</label>
              <input data-required="true" type="number" min="0" step="0.1" placeholder="Ex: 150" [value]="formData().poids" (input)="onPoidsChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Type de Poisson *</label>
              <select data-required="true" [value]="formData().typePoisson" (change)="onTypePoissonChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500">
                <option value="Maquereau">Maquereau</option>
                <option value="Sardine">Sardine</option>
                <option value="Thon">Thon</option>
                <option value="Dorade">Dorade</option>
                <option value="Autre">Autre</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Température (°C)</label>
              <input type="number" step="0.1" placeholder="Ex: -5" [value]="formData().temperatura" (input)="onTemperaturaChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
              <input type="date" [value]="toISOStringSummary()" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500" />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Observations</label>
            <textarea [rows]="3" placeholder="Observations..." [value]="formData().observations" (input)="onObservationsChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 resize-none"></textarea>
          </div>
        </div>
        <div class="p-6 border-t border-gray-200 flex justify-end gap-3">
          <button type="button" (click)="closed.emit()" class="px-4 py-2 text-gray-700 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50">Annuler</button>
          <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
