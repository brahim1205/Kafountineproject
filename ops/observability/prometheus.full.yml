global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "kafontine-backend"
    metrics_path: "/metrics"
    dns_sd_configs:
      - names:
          - backend
        type: A
        port: 3000
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: instance

