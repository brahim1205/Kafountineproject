name: Deploy Production
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['database/**', 'backend-spring/**', 'front-angular/**', '.github/workflows/deploy.yml', 'scripts/deploy-images.sh']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified images to production
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-mutation
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/brahim1205/kafontine

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            database/package-lock.json
            front-angular/package-lock.json
      - run: bash ./scripts/security-repo-scan.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -q -Dmaven.test.skip=true package
        working-directory: backend-spring
      - run: npm ci && npx prisma validate
        working-directory: database
        env:
          DATABASE_URL: postgresql://validate:validate@127.0.0.1:5432/validate?schema=public
      - run: npm audit --omit=dev --audit-level=high
        working-directory: database
      - run: npm ci
        working-directory: front-angular
      - run: npm run build && npm test -- --watch=false
        working-directory: front-angular
      - run: npm audit --omit=dev --audit-level=high
        working-directory: front-angular

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            context: backend-spring
          # Image dédiée à l'application des migrations Prisma.
          - component: migrator
            context: database
          - component: frontend
            context: front-angular
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile.prod
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: build-and-push
    if: inputs.deploy == true || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ vars.APP_DIR || '/opt/kafontine' }}
      HEALTH_URL: ${{ secrets.HEALTH_URL || 'https://orbyteconsulting.tech/ready' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/production-ssh
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Back up and deploy release images
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$APP_DIR" =~ ^/[a-zA-Z0-9/_-]+$ ]]
          [[ "$GITHUB_ACTOR" =~ ^[a-zA-Z0-9_-]+$ ]]
          printf '%s' "$REGISTRY_TOKEN" | ssh kafontine-production "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh kafontine-production "bash -s -- '$APP_DIR' 'pre_deploy_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.dump'" < scripts/backup-production.sh
          ssh kafontine-production "bash -s -- '$APP_DIR' '$IMAGE_PREFIX-backend:$GITHUB_SHA' '$IMAGE_PREFIX-frontend:$GITHUB_SHA' deploy '$IMAGE_PREFIX-migrator:$GITHUB_SHA'" < scripts/deploy-images.sh
      - name: Verify public readiness
        run: curl -fsS --max-time 60 "$HEALTH_URL"
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/kafontine_actions
