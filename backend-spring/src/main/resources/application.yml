# Configuration lue à partir des MÊMES variables d'environnement que le backend Node
# (DATABASE_URL, REDIS_URL, JWT_SECRET…) : voir shared/config/Env.java.
server:
  port: ${PORT:3000}
  forward-headers-strategy: none
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: kafountine-backend-spring
  main:
    banner-mode: off
  jackson:
    default-property-inclusion: always
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

springdoc:
  api-docs:
    path: /api-docs/openapi.json
  swagger-ui:
    path: /api-docs

logging:
  level:
    root: INFO
