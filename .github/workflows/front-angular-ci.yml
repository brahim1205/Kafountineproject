name: Front Angular CI

on:
  push:
    paths:
      - 'front-angular/**'
      - '.github/workflows/front-angular-ci.yml'
  pull_request:
    paths:
      - 'front-angular/**'
      - '.github/workflows/front-angular-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front-angular/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --watch=false --coverage
      - run: npm audit --omit=dev --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: ./front-angular
          file: ./front-angular/Dockerfile.prod
          push: false
          tags: kafontine-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
