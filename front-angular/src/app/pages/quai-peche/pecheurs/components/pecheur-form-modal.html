  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-lg">
      <div class="p-6 border-b border-gray-200">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-gray-900">{{ title() }}</h3>
          <button aria-label="Fermer" (click)="closed.emit()" class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg">
            <i class="ri-close-line text-xl"></i>
          </button>
        </div>
      </div>
      <form (submit)="submitted.emit($event)" (input)="clearFieldValidationError($event)" novalidate>
        <div class="p-6 space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nom *</label>
              <input name="nom" aria-label="Nom" data-required="true" type="text" placeholder="Ex: Sall" [value]="formData().nom" (input)="onNomChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Prénom *</label>
              <input name="prenom" aria-label="Prénom" data-required="true" type="text" placeholder="Ex: Moussa" [value]="formData().prenom" (input)="onPrenomChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
              <input name="telephone" aria-label="Téléphone" type="tel" inputmode="tel" placeholder="Ex: 77 123 45 67" [value]="formData().telephone" (input)="onTelephoneChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">NIN</label>
              <input name="nin" aria-label="NIN" type="text" placeholder="Numéro d'identification" [value]="formData().nin" (input)="onNinChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500" />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
            <input name="adresse" aria-label="Adresse" type="text" placeholder="Adresse" [value]="formData().adresse" (input)="onAdresseChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500" />
          </div>
        </div>
        <div class="p-6 border-t border-gray-200 flex justify-end gap-3">
          <button type="button" (click)="closed.emit()" class="px-4 py-2 text-gray-700 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50">Annuler</button>
          <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
