  <div class="fixed inset-0 bg-gray-900/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg max-w-2xl w-full">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-semibold text-gray-900">Détails de la place</h3>
        <button (click)="closed.emit()" aria-label="Fermer" class="w-8 h-8 flex items-center justify-center text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors cursor-pointer">
          <i class="ri-close-line text-xl"></i>
        </button>
      </div>
      <dl class="p-6 grid grid-cols-2 gap-4">
        @for (row of details(); track $index) {
          @let label = row[0];
          @let value = row[1];
          <div>
            <dt class="text-sm text-gray-600 mb-1">{{ label }}</dt>
            <dd class="text-base font-medium text-gray-900">{{ value }}</dd>
          </div>
        }
        <div>
          <dt class="text-sm text-gray-600 mb-1">Statut</dt>
          <dd>
            <span [class]="`inline-block px-3 py-1 text-sm font-medium rounded-full ${statutBadge(place().statut)}`">{{ place().statut }}</span>
          </dd>
        </div>
      </dl>
      <div class="px-6 pb-6">
        <button (click)="closed.emit()" class="w-full px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer">Fermer</button>
      </div>
    </div>
  </div>
