name: Front Angular CI

on:
  push:
    paths:
      - 'front-angular/**'
      - '.github/workflows/front-angular-ci.yml'
  pull_request:
    paths:
      - 'front-angular/**'
      - '.github/workflows/front-angular-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front-angular/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
