  <div class="fixed inset-0 bg-gray-900/50 z-50" (click)="closed.emit()"></div>
  <div class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="bg-white rounded-lg shadow-xl w-full max-w-3xl">
        <div class="flex items-center justify-between p-6 border-b border-gray-200">
          <div>
            <h2 class="text-xl font-bold text-gray-900">Gestion des présences</h2>
            <p class="text-sm text-gray-600 mt-1">{{ formation()?.nom }}</p>
          </div>
          <button aria-label="Fermer" (click)="closed.emit()" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-600 rounded-lg hover:bg-gray-100 transition-colors">
            <i class="ri-close-line text-xl"></i>
          </button>
        </div>
        <form (submit)="handleSubmit($event)" class="p-6">
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Date de présence</label>
            <input aria-label="Date de présence" type="date" [value]="datePresence()" (input)="datePresence.set($any($event.target).value)" class="w-full max-w-xs px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm" />
          </div>
          <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-green-50 rounded-lg p-4 text-center">
              <p class="text-sm text-green-700 mb-1">Présents</p>
              <p class="text-2xl font-bold text-green-600">{{ nombrePresents() }}</p>
            </div>
            <div class="bg-red-50 rounded-lg p-4 text-center">
              <p class="text-sm text-red-700 mb-1">Absents</p>
              <p class="text-2xl font-bold text-red-600">{{ nombreAbsents() }}</p>
            </div>
          </div>
          <div class="space-y-2 max-h-96 overflow-y-auto mb-6">
            @for (jeune of jeunesFormation(); track jeune.id) {
              <div [class]="`flex items-center gap-3 p-3 rounded-lg border-2 transition-colors cursor-pointer ${presences()[jeune.id] ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'}`" (click)="handleTogglePresence(jeune.id)">
                <div class="w-12 h-12 rounded-lg overflow-hidden bg-gray-100 flex-shrink-0">
                  <img [src]="jeune.photo" [alt]="`${jeune.prenom} ${jeune.nom}`" class="w-full h-full object-cover" />
                </div>
                <div class="flex-1">
                  <p class="font-medium text-gray-900">{{ jeune.prenom }}&ngsp;{{ jeune.nom }}</p>
                  <p class="text-sm text-gray-600">Assiduité :
                    {{ jeune.tauxAssiduite }}%</p>
                </div>
                <div [class]="`w-10 h-10 rounded-lg flex items-center justify-center ${presences()[jeune.id] ? 'bg-green-500' : 'bg-red-500'}`">
                  <i [class]="`${presences()[jeune.id] ? 'ri-check-line' : 'ri-close-line'} text-white text-xl`"></i>
                </div>
              </div>
            }
          </div>
          <div class="flex gap-3">
            <button type="button" (click)="closed.emit()" class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors whitespace-nowrap">Annuler</button>
            <button type="submit" class="flex-1 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors whitespace-nowrap">Enregistrer les présences</button>
          </div>
        </form>
      </div>
    </div>
  </div>
