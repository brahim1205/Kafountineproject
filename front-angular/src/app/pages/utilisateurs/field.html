  <div>
    <label class="block text-sm font-medium text-gray-700 mb-2">
      {{ label() }}
    </label>
    <input [attr.name]="name()" [type]="type()" [attr.data-required]="required() ? 'true' : undefined" [attr.minlength]="minLength()" [attr.autocomplete]="autoComplete()" [value]="defaultValue()" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none text-sm" />
  </div>
