apiVersion: v1
kind: Secret
metadata:
  name: kafontine-secrets
  namespace: kafontine
type: Opaque
stringData:
  POSTGRES_PASSWORD: "__SET_POSTGRES_PASSWORD__"
  DATABASE_URL: "postgresql://postgres:__SET_POSTGRES_PASSWORD__@postgres:5432/vhm-finances?schema=public&connection_limit=20&pool_timeout=10"
  JWT_SECRET: "__SET_JWT_SECRET_MIN_32_CHARS__"
  JWT_REFRESH_SECRET: "__SET_JWT_REFRESH_SECRET_MIN_32_CHARS__"
  REDIS_PASSWORD: "__SET_REDIS_PASSWORD__"
  REDIS_URL: "redis://:__SET_REDIS_PASSWORD__@redis:6379"
  PORTAL_OTP_WEBHOOK_URL: "https://sms-provider.kafontine.gouv.sn/send-otp"
  PORTAL_OTP_WEBHOOK_TOKEN: "__SET_PORTAL_OTP_WEBHOOK_TOKEN__"
  METRICS_BEARER_TOKEN: "__SET_METRICS_BEARER_TOKEN_MIN_32_CHARS__"
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "__SET_GRAFANA_ADMIN_PASSWORD__"
