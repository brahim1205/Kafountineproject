name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        default: database-backup

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      APP_DIR: ${{ vars.APP_DIR || '/opt/kafontine' }}
      BACKUP_FILENAME: kafontine_${{ github.run_id }}_${{ github.run_attempt }}.dump
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/production-ssh
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Create and validate database backup
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_DIR" =~ ^/[a-zA-Z0-9/_-]+$ ]]
          ssh kafontine-production "bash -s -- '$APP_DIR' '$BACKUP_FILENAME'" < scripts/backup-production.sh
      - name: Download verified backup
        run: |
          set -euo pipefail
          install -d -m 700 backups
          scp "kafontine-production:$APP_DIR/backups/$BACKUP_FILENAME" "backups/$BACKUP_FILENAME"
          test -s "backups/$BACKUP_FILENAME"
          # Fichiers déposés (photos) : archive à côté du dump, absente si le backend était arrêté.
          uploads="${BACKUP_FILENAME%.dump}.uploads.tar.gz"
          if ssh kafontine-production "test -s '$APP_DIR/backups/$uploads'"; then
            scp "kafontine-production:$APP_DIR/backups/$uploads" "backups/$uploads"
          else
            echo "::warning::Archive des fichiers déposés absente pour cette sauvegarde."
          fi
      # La sauvegarde contient des données personnelles (NIN, téléphones) : elle est chiffrée avec age
      # avant de quitter le serveur. Seule la clé privée, conservée hors de GitHub, permet de la lire
      # (voir RUNBOOK_PRODUCTION.md, « Sauvegardes chiffrées »).
      - name: Encrypt backup
        id: encrypt
        env:
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          # Le dépôt est public : un artefact en clair serait téléchargeable par n'importe quel compte GitHub.
          # Sans clé de chiffrement, la sauvegarde reste sur le serveur et rien n'est publié.
          if [[ -z "$AGE_RECIPIENT" ]]; then
            echo "::error::Secret BACKUP_AGE_RECIPIENT absent : sauvegarde gardée sur le serveur seulement, aucun artefact en clair publié (RUNBOOK_PRODUCTION.md)."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          for file in backups/*.dump backups/*.uploads.tar.gz; do
            [[ -e "$file" ]] || continue
            age -r "$AGE_RECIPIENT" -o "$file.age" "$file"
            test -s "$file.age"
            # Seul le fichier en clair est retiré : le fichier chiffré est celui qu'on archive.
            rm -f "$file"
          done
          test -s "backups/$BACKUP_FILENAME.age"
          echo "file=backups/*.age" >> "$GITHUB_OUTPUT"
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'database-backup' }}
          path: ${{ steps.encrypt.outputs.file }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary credentials and dump
        if: always()
        run: |
          rm -f ~/.ssh/kafontine_actions
          rm -rf backups
