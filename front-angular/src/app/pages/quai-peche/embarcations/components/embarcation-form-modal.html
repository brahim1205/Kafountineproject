  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-lg">
      <div class="p-6 border-b border-gray-200">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-gray-900">{{ title() }}</h3>
          <button aria-label="Fermer" (click)="closed.emit()" class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg">
            <i class="ri-close-line text-xl"></i>
          </button>
        </div>
      </div>
      <form (submit)="submitted.emit($event)" (input)="clearFieldValidationError($event)" novalidate>
        <div class="p-6 space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nom *</label>
              <input aria-label="Nom" data-required="true" type="text" placeholder="Ex: Bateau A" [value]="formData().nom" (input)="onNomChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Immatriculation *</label>
              <input aria-label="Immatriculation" data-required="true" type="text" placeholder="Ex: KP-001" [value]="formData().immatriculation" (input)="onImmatriculationChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Type *</label>
              <select aria-label="Type" data-required="true" [value]="formData().type" (change)="onTypeChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500">
                <option value="Pirogue">Pirogue</option>
                <option value="Canot">Canot</option>
                <option value="Chalutier">Chalutier</option>
                <option value="Senneur">Senneur</option>
                <option value="Autre">Autre</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Taille (m)</label>
              <input aria-label="Taille (m)" type="number" step="0.1" min="0" placeholder="Ex: 12" [value]="formData().taille" (input)="onTailleChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Moteur</label>
              <input aria-label="Moteur" type="text" placeholder="Ex: Yamaha 40 CV" [value]="formData().moteur" (input)="onMoteurChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Propriétaire</label>
              <select aria-label="Propriétaire" [value]="formData().pecheurId" (change)="onPecheurIdChange($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500">
                <option value="">Sélectionner un pêcheur</option>
                @for (p of pecheurs(); track p.id) {
                  <option [value]="p.id">{{ p.prenom }}&ngsp;{{ p.nom }}</option>
                }
              </select>
            </div>
          </div>
        </div>
        <div class="p-6 border-t border-gray-200 flex justify-end gap-3">
          <button type="button" (click)="closed.emit()" class="px-4 py-2 text-gray-700 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50">Annuler</button>
          <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
