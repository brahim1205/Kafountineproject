name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'front/e2e/**'
      - 'front/src/**'
      - 'front/playwright.config.ts'
      - 'front/package.json'
      - 'front/package-lock.json'
      - 'backend/**'
      - 'scripts/security-repo-scan.sh'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'front/e2e/**'
      - 'front/src/**'
      - 'front/playwright.config.ts'
      - 'front/package.json'
      - 'front/package-lock.json'
      - 'backend/**'
      - 'scripts/security-repo-scan.sh'
      - '.github/workflows/e2e.yml'

env:
  NODE_VERSION: '22'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vhm-finances?schema=public
      JWT_SECRET: ci_e2e_jwt_secret_32_chars_minimum_value
      JWT_REFRESH_SECRET: ci_e2e_refresh_secret_32_chars_minimum
      SEED_DEFAULT_PASSWORD: TestPassword123!
      CORS_ORIGIN: http://localhost:4173
      COOKIE_SAME_SITE: lax
      PORTAL_URL: http://localhost:4173
      PORTAL_OTP_DELIVERY_MODE: dev
      PORTAL_OTP_TTL_SECONDS: 300
      REDIS_URL: redis://127.0.0.1:6379
      # La suite se connecte des dizaines de fois depuis la même IP : on lève la limite anti-bruteforce en test.
      LOGIN_RATE_LIMIT_MAX: 1000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vhm-finances
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vhm-finances"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: front

      - name: Build frontend
        run: npm run build
        working-directory: front
        env:
          VITE_API_URL: http://localhost:3000/api/v1

      - name: Start backend for testing
        run: |
          cd backend
          npm ci
          npm run prisma:generate
          npx prisma validate
          npm run prisma:deploy
          npm run prisma:seed
          npm run build
          npm start > /tmp/kafontine-backend.log 2>&1 &
          sleep 10

      - name: Repository security scan
        run: bash ./scripts/security-repo-scan.sh

      - name: Start frontend for testing
        run: npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/kafontine-front.log 2>&1 &
        working-directory: front
        env:
          VITE_API_URL: http://localhost:3000/api/v1

      - name: Wait for services
        run: |
          sleep 10
          curl -f http://localhost:4173 || exit 1
          for i in {1..30}; do
            if curl -f http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start. Last logs:" >&2
          tail -n 200 /tmp/kafontine-backend.log >&2 || true
          exit 1

      - name: Run E2E tests
        run: npx playwright test
        working-directory: front
        env:
          FRONTEND_URL: http://localhost:4173
          CI: 'true'
          PLAYWRIGHT_EXTERNAL_SERVER: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: front/test-results/
          retention-days: 14
