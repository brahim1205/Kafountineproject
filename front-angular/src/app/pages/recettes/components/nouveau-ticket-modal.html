@if (receipt()) {
  <app-modal title="Nouveau ticket de paiement" size="2xl" (closed)="closed.emit()">
    <div class="text-center py-4">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="ri-check-line text-3xl text-green-600"></i>
      </div>
      <h3 class="text-lg font-semibold text-gray-900 mb-2">Ticket enregistré avec succès !</h3>
      <p class="text-sm text-gray-600 mb-6">Numéro de ticket :
        <strong>{{ receipt()!.ticketNumber }}</strong>
      </p>
      <div class="flex items-center justify-center gap-3">
        <button (click)="closed.emit()" [class]="BUTTON_SECONDARY">Fermer</button>
        <button (click)="print.emit(receipt()!)" [class]="BUTTON_PRIMARY">
          <i class="ri-printer-line"></i>Générer le reçu</button>
      </div>
    </div>
  </app-modal>
} @else {
  <app-modal title="Nouveau ticket de paiement" size="2xl" (closed)="closed.emit()">
    <form (submit)="handleSubmit($event)" (input)="clearFieldValidationError($event)" novalidate class="space-y-4">
      <app-field label="Type de taxe">
        <input name="type" data-required="true" [class]="INPUT_CLASS" placeholder="Ex: Ticket journalier" />
      </app-field>
      <app-field label="Contribuable">
        <app-contribuable-select name="contributorId" [inputClassName]="INPUT_CLASS"></app-contribuable-select>
      </app-field>
      <app-field label="Montant (FCFA)">
        <input type="number" name="amount" data-required="true" min="1" [class]="INPUT_CLASS" />
      </app-field>
      <app-mode-paiement [(value)]="modePaiement"></app-mode-paiement>
      <div class="flex items-center justify-end gap-3 pt-4">
        <button type="button" (click)="closed.emit()" [class]="BUTTON_SECONDARY">Annuler</button>
        <button type="submit" [disabled]="submitting()" [class]="BUTTON_PRIMARY">
          <i class="ri-check-line"></i>{{ submitting() ? 'Enregistrement...' : 'Enregistrer le ticket' }}</button>
      </div>
    </form>
  </app-modal>
}
