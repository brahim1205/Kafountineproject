  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    @for (card of CARDS; track card.key) {
      <div class="bg-white rounded-xl p-5 border border-gray-100">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm text-gray-600">{{ card.label }}</p>
            <p [class]="`text-2xl font-bold mt-1 ${card.key === 'enRetard' ? 'text-red-600' : 'text-gray-900'}`">{{ card.key === 'recettesMois' ? `${(stats().recettesMois || 0).toLocaleString()} FCFA` : stats()[card.key] }}</p>
          </div>
          <div [class]="`w-12 h-12 rounded-lg flex items-center justify-center ${TONES[card.tone]}`">
            <i [class]="`${card.icon} text-2xl`"></i>
          </div>
        </div>
      </div>
    }
  </div>
