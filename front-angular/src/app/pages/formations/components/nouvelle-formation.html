  <div class="fixed inset-0 bg-gray-900/50 z-50" (click)="closed.emit()"></div>
  <div class="fixed inset-0 z-50 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl">
        <div class="flex items-center justify-between p-6 border-b border-gray-200">
          <div>
            <h2 class="text-xl font-bold text-gray-900">Nouvelle Formation</h2>
            <p class="text-sm text-gray-500 mt-1">Créez une formation puis ajoutez-y des participants</p>
          </div>
          <button aria-label="Fermer" (click)="closed.emit()" class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-600 rounded-lg hover:bg-gray-100 transition-colors cursor-pointer">
            <i class="ri-close-line text-xl"></i>
          </button>
        </div>
        <form (submit)="handleSubmit($event)" (input)="clearFieldValidationError($event)" novalidate class="p-6">
          @if (errorMsg()) {
            <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ errorMsg() }}</div>
          }
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">Nom de la formation *</label>
              <input aria-label="Nom de la formation" type="text" data-required="true" [value]="formData().nom" (input)="onNomChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm" placeholder="Ex: Couture et Confection" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Domaine *</label>
              <select aria-label="Domaine" data-required="true" [value]="formData().domaine" (change)="onDomaineChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm cursor-pointer">
                <option value="">Sélectionner</option>
                <option value="Artisanat">Artisanat</option>
                <option value="Services">Services</option>
                <option value="Agriculture">Agriculture</option>
                <option value="Technique">Technique</option>
                <option value="Agroalimentaire">Agroalimentaire</option>
                <option value="Commerce">Commerce</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Durée *</label>
              <input aria-label="Durée" type="text" data-required="true" [value]="formData().duree" (input)="onDureeChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm" placeholder="Ex: 6 mois" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Responsable *</label>
              <input aria-label="Responsable" type="text" data-required="true" [value]="formData().responsable" (input)="onResponsableChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm" placeholder="Nom du responsable" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Budget (FCFA) *</label>
              <input aria-label="Budget (FCFA)" type="number" data-required="true" [value]="formData().budget" (input)="onBudgetChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm" placeholder="0" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Date de début *</label>
              <input aria-label="Date de début" type="date" data-required="true" [value]="formData().dateDebut" (input)="onDateDebutChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Date de fin *</label>
              <input aria-label="Date de fin" type="date" data-required="true" [value]="formData().dateFin" (input)="onDateFinChange($event)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm" />
            </div>
          </div>
          <div class="mt-5 bg-emerald-50 border border-emerald-200 rounded-lg p-4 flex items-start gap-3">
            <i class="ri-information-line text-emerald-600 text-lg mt-0.5"></i>
            <div>
              <p class="text-sm text-emerald-800 font-medium">Après la création</p>
              <p class="text-xs text-emerald-700 mt-1">Vous pourrez ajouter des participants à cette formation depuis la fiche détaillée ou via le bouton "Inscrire un jeune".</p>
            </div>
          </div>
          <div class="flex gap-3 mt-6">
            <button type="button" (click)="closed.emit()" class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors whitespace-nowrap cursor-pointer">Annuler</button>
            <button type="submit" class="flex-1 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors whitespace-nowrap cursor-pointer">
              <i class="ri-add-line mr-1"></i>Créer la formation</button>
          </div>
        </form>
      </div>
    </div>
  </div>
