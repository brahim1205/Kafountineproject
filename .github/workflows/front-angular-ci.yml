name: Front Angular CI

on:
  push:
    paths:
      - 'front-angular/**'
      - '.github/workflows/front-angular-ci.yml'
  pull_request:
    paths:
      - 'front-angular/**'
      - '.github/workflows/front-angular-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front-angular/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --watch=false --coverage
      - run: npm audit --omit=dev --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: ./front-angular
          file: ./front-angular/Dockerfile.prod
          push: false
          load: true
          tags: kafontine-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check cache headers
        run: |
          docker run -d --name front -p 8080:8080 -e NGINX_BACKEND_URL=http://127.0.0.1:3000 kafontine-frontend:${{ github.sha }}
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          index="$(curl -fsSI http://127.0.0.1:8080/)"
          echo "$index"
          grep -qi '^cache-control: no-cache' <<<"$index"
          grep -qi '^content-security-policy:' <<<"$index"
          main="$(curl -fs http://127.0.0.1:8080/ | grep -oE 'main-[A-Za-z0-9_]+\.js' | head -1)"
          curl -fsSI "http://127.0.0.1:8080/$main" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          docker rm -f front
