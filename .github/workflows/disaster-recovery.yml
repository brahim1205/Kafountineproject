name: Disaster Recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - status
          - restore-latest

env:
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'kafontine' }}
  POSTGRES_SELECTOR: ${{ secrets.POSTGRES_SELECTOR || 'app.kubernetes.io/instance=kafontine,app.kubernetes.io/name=postgresql' }}
  BACKEND_DEPLOYMENT: ${{ secrets.BACKEND_DEPLOYMENT || 'kafontine-backend' }}

jobs:
  status:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'status'
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_DATA}" | base64 -d > "$HOME/.kube/config"
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Check cluster status
        run: |
          kubectl get pods -n "${K8S_NAMESPACE}"
          kubectl get pvc -n "${K8S_NAMESPACE}"
          kubectl get ingress -n "${K8S_NAMESPACE}" || true

  restore-latest:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'restore-latest'
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_DATA}" | base64 -d > "$HOME/.kube/config"
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Download latest backup
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: backup.yml
          name: database-backup

      - name: Restore backup into postgres pod
        run: |
          POD_NAME="$(kubectl get pods -n "${K8S_NAMESPACE}" -l "${POSTGRES_SELECTOR}" -o jsonpath='{.items[0].metadata.name}')"
          test -n "${POD_NAME}"
          LATEST="$(find . -name "*.dump" | sort | tail -1)"
          test -n "${LATEST}"
          cat "${LATEST}" | kubectl exec -i -n "${K8S_NAMESPACE}" "${POD_NAME}" -- sh -lc 'pg_restore --clean --if-exists -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

      - name: Verify backend readiness
        run: |
          kubectl rollout status deployment/"${BACKEND_DEPLOYMENT}" -n "${K8S_NAMESPACE}" --timeout=180s
