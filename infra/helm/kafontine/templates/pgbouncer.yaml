{{- if .Values.pgbouncer.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafontine.fullname" . }}-pgbouncer-config
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    app.kubernetes.io/component: pgbouncer
    {{- include "kafontine.labels" . | nindent 4 }}
data:
  pgbouncer.ini: |
    [databases]
    {{ .Values.postgresql.auth.database }} = host={{ include "kafontine.postgresql.host" . }} port=5432 dbname={{ .Values.postgresql.auth.database }}

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = {{ .Values.pgbouncer.service.port }}
    auth_type = plain
    pool_mode = transaction
    max_client_conn = 100
    default_pool_size = 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafontine.fullname" . }}-pgbouncer
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    app.kubernetes.io/component: pgbouncer
    {{- include "kafontine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.pgbouncer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: pgbouncer
      {{- include "kafontine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: pgbouncer
        {{- include "kafontine.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kafontine.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pgbouncer
          image: {{ .Values.pgbouncer.image.repository }}:{{ .Values.pgbouncer.image.tag }}
          imagePullPolicy: {{ .Values.pgbouncer.image.pullPolicy }}
          ports:
            - name: tcp
              containerPort: {{ .Values.pgbouncer.service.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
            - name: auth
              mountPath: /etc/pgbouncer/users.txt
              subPath: users.txt
          resources:
            {{- toYaml .Values.pgbouncer.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kafontine.fullname" . }}-pgbouncer-config
{{- if .Values.securityContext.readOnlyRootFilesystem }}
            defaultMode: 0444
{{- end }}
        - name: auth
          secret:
            secretName: {{ include "kafontine.pgbouncerAuthSecretName" . }}
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafontine.pgbouncer.host" . }}
  namespace: {{ include "kafontine.namespace" . }}
  labels:
    app.kubernetes.io/component: pgbouncer
    {{- include "kafontine.labels" . | nindent 4 }}
spec:
  type: {{ .Values.pgbouncer.service.type }}
  ports:
    - port: {{ .Values.pgbouncer.service.port }}
      targetPort: tcp
      protocol: TCP
      name: tcp
  selector:
    app.kubernetes.io/component: pgbouncer
    {{- include "kafontine.selectorLabels" . | nindent 4 }}
{{- end }}
