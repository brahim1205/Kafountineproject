  <button type="button" (click)="cancelled.emit()" class="px-4 py-2 text-gray-700 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50">Annuler</button>
  <button type="submit" [attr.form]="form()" [disabled]="submitting()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 disabled:opacity-60">
    {{ submitting() ? 'Enregistrement...' : label() }}
  </button>
