  <app-modal title="Nouvelle expédition" (closed)="closed.emit()" [footerSlot]="true">
    <ng-container ngProjectAs="[slot-footer]">
      <app-footer-buttons (cancelled)="closed.emit()" form="form-expedition" [submitting]="submitting()"></app-footer-buttons>
    </ng-container>
    <form id="form-expedition" (submit)="handleSubmit($event)" (input)="clearFieldValidationError($event)" novalidate class="space-y-4">
      <app-field label="Camion" [required]="true">
        <select name="camionId" data-required="true" [class]="INPUT_CLASS">
          <option value="">{{ camionsActifs().length ? 'Sélectionner un camion' : 'Aucun camion actif' }}</option>
          @for (camion of camionsActifs(); track camion.id) {
            <option [value]="camion.id">{{ camion.immatriculation }}
              —
              {{ camion.marque }}</option>
          }
        </select>
      </app-field>
      <div class="grid grid-cols-2 gap-4">
        <app-field label="Poids (kg)" [required]="true">
          <input name="poids" type="number" min="0.1" step="0.1" data-required="true" placeholder="Ex: 1500" [class]="INPUT_CLASS" />
        </app-field>
        <app-field label="Montant (FCFA)">
          <input name="montant" type="number" min="0" placeholder="Ex: 25000" [class]="INPUT_CLASS" />
        </app-field>
      </div>
      <app-field label="Destination">
        <input name="destination" placeholder="Ville de destination" [class]="INPUT_CLASS" />
      </app-field>
      <app-field label="Observations">
        <textarea name="observations" [rows]="3" placeholder="Observations..." [class]="`${INPUT_CLASS} resize-none`"></textarea>
      </app-field>
      @if (error()) {
        <p class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-3">{{ error() }}</p>
      }
    </form>
  </app-modal>
