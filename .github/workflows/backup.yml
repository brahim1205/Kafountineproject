name: Database Backup

on:
  schedule:
    # Run daily at 2 AM
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Backup type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - incremental

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      BACKUP_FILENAME: kafontine_${{ github.run_id }}_${{ github.run_attempt }}.dump
      BACKUP_RETENTION_DAYS: 14
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate production environment template
        run: bash ./scripts/validate-prod-env.sh --allow-placeholders .env.prod.example

      - name: Check backup prerequisites
        id: backup-check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=0
          for key in SSH_HOST SSH_USERNAME SSH_KEY; do
            if [ -z "${!key}" ]; then
              echo "Missing required production secret: $key" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Backup prerequisites are incomplete. Define the missing secrets in GitHub Actions > Environments > production." >&2
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Create backup on server
        if: steps.backup-check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            if [ -d /opt/kafountine/Kafountineproject ]; then
              APP_DIR=/opt/kafountine/Kafountineproject
            elif [ -d /opt/kafountine ]; then
              APP_DIR=/opt/kafountine
            else
              echo "Application directory not found" >&2
              exit 1
            fi
            cd "$APP_DIR"
            bash ./scripts/validate-prod-env.sh .env.prod
            mkdir -p backups
            docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T postgres \
              sh -lc 'exec pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "backups/${{ env.BACKUP_FILENAME }}"
            find backups -name "kafontine_*.dump" -mtime +"${BACKUP_RETENTION_DAYS:-14}" -delete

      - name: Download backup from server
        if: steps.backup-check.outputs.enabled == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: /opt/kafountine/Kafountineproject/backups/${{ env.BACKUP_FILENAME }}
          target: ./backups

      - name: Upload backup artifacts
        if: steps.backup-check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: ./backups/${{ env.BACKUP_FILENAME }}
          retention-days: 30

      - name: Upload to S3 (if configured)
        if: steps.backup-check.outputs.enabled == 'true' && env.AWS_S3_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 cp "./backups/${{ env.BACKUP_FILENAME }}" "s3://${AWS_S3_BUCKET}/$(date +%Y/%m/%d)/${{ env.BACKUP_FILENAME }}"

      - name: Cleanup old backups from S3
        if: steps.backup-check.outputs.enabled == 'true' && env.AWS_S3_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # Keep last 30 days of backups
          aws s3 ls "s3://${AWS_S3_BUCKET}/" | while read -r line; do
            createDate=$(echo "$line" | awk '{print $1" "$2" "$4}')
            createDate=$(date -d "$createDate" +%s)
            olderThan=$(date -d "-30 days" +%s)
            if [ $createDate -lt $olderThan ]; then
              folder=$(echo "$line" | awk '{print $4}')
              aws s3 rm "s3://${AWS_S3_BUCKET}/$folder/" --recursive
            fi
          done
