sonar.projectKey=kafontine-gestion-municipale
sonar.projectName=Kafontine Gestion Municipale
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,front/src
sonar.tests=backend/test,backend/src,front/src/test,front/e2e

sonar.exclusions=**/node_modules/**,**/dist/**,**/out/**,**/coverage/**,**/build/**,**/*.d.ts,front/auto-imports.d.ts,backend/prisma/**,backend/src/generated/**,**/*.config.*,**/vite.config.*,**/vitest.config.*,**/jest.config.*,**/playwright.config.*,**/.codex/**,**/.github/**,**/migrations/**
sonar.test.inclusions=backend/test/**/*.js,backend/test/**/*.ts,backend/src/**/*.test.ts,front/src/test/**/*.ts,front/e2e/**/*.ts

sonar.javascript.lcov.reportPaths=front/coverage/lcov.info
sonar.typescript.tsconfigPaths=backend/tsconfig.json,front/tsconfig.app.json,front/tsconfig.node.json

sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=**/.env*.example
