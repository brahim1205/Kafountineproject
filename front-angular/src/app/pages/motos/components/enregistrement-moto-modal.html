  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
        <h2 class="text-xl font-bold text-gray-900">Enregistrer une nouvelle moto</h2>
        <button aria-label="Fermer" (click)="closed.emit()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors cursor-pointer">
          <i class="ri-close-line text-xl text-gray-600"></i>
        </button>
      </div>
      <form (submit)="handleSubmit($event)" (input)="clearFieldValidationError($event)" novalidate class="p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <section class="md:col-span-2">
            <h3 class="font-semibold text-gray-900 mb-4 flex items-center gap-2">
              <i class="ri-motorbike-line text-emerald-600"></i>Informations de la moto</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <app-field label="Matricule" name="matricule" [required]="true" placeholder="DK-1234-AB"></app-field>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Marque
                  <span class="text-red-500">*</span>
                </label>
                <select aria-label="Marque" name="marque" data-required="true" [class]="`${INPUT_CLASS} cursor-pointer`">
                  <option value="">Sélectionner</option>
                  <option value="Honda">Honda</option>
                  <option value="Yamaha">Yamaha</option>
                  <option value="Suzuki">Suzuki</option>
                  <option value="Autre">Autre</option>
                </select>
              </div>
              <app-field label="Modèle" name="modele" [required]="true" placeholder="CG 125"></app-field>
              <app-field label="Année" name="annee" type="number" [required]="true" placeholder="2024" [min]="1900" [max]="selectedYear() + 1"></app-field>
              <app-field label="Couleur" name="couleur" placeholder="Rouge"></app-field>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Photo</label>
                <input type="file" name="photo" accept="image/*" [class]="`${INPUT_CLASS} cursor-pointer`" />
              </div>
            </div>
          </section>
          <section class="md:col-span-2">
            <h3 class="font-semibold text-gray-900 mb-4 flex items-center gap-2">
              <i class="ri-user-line text-emerald-600"></i>Informations du propriétaire</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <app-field label="Nom complet" name="nomProprietaire" [required]="true" placeholder="Mamadou Diallo"></app-field>
              <app-field label="N° CNI" name="cniProprietaire" [required]="true" placeholder="1234567890123"></app-field>
              <app-field label="Téléphone" name="telephoneProprietaire" type="tel" [required]="true" placeholder="77 123 45 67"></app-field>
              <app-field label="Adresse" name="adresseProprietaire" placeholder="Quartier, Kafountine"></app-field>
            </div>
          </section>
          <section class="md:col-span-2">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-semibold text-gray-900 flex items-center gap-2">
                <i class="ri-steering-2-line text-emerald-600"></i>Informations du conducteur</h3>
              <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
                <input type="checkbox" name="isSameDriver" class="rounded cursor-pointer" />Même que le propriétaire</label>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <app-field label="Nom complet" name="nomConducteur" placeholder="Mamadou Diallo"></app-field>
              <app-field label="N° CNI" name="cniConducteur" placeholder="1234567890123"></app-field>
              <app-field label="Téléphone" name="telephoneConducteur" type="tel" placeholder="77 123 45 67"></app-field>
              <app-field label="N° Permis" name="permisConducteur" placeholder="A-2024-12345"></app-field>
            </div>
          </section>
        </div>
        <p class="text-sm text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-lg p-3">
          <i class="ri-money-dollar-circle-line mr-1"></i>Droit d’adhésion à encaisser :
          <strong>{{ droitAdhesion().toLocaleString() }}
            FCFA</strong>. Le reçu s’affiche après l’enregistrement.</p>
        <div class="flex gap-3 mt-6 pt-6 border-t border-gray-200">
          <button type="button" (click)="closed.emit()" [disabled]="isSubmitting()" class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors whitespace-nowrap cursor-pointer">Annuler</button>
          <button type="submit" [disabled]="isSubmitting()" [class]="`flex-1 px-4 py-2 text-white rounded-lg whitespace-nowrap cursor-pointer ${isSubmitting() ? 'bg-gray-400 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 transition-colors'}`">
            <i [class]="`ri-${isSubmitting() ? 'loader-4-line animate-spin' : 'check-line'} mr-2`"></i>{{ isSubmitting() ? 'Enregistrement...' : 'Enregistrer et encaisser' }}</button>
        </div>
        <app-form-error [message]="error()"></app-form-error>
      </form>
    </div>
  </div>
