name: Guide de démarrage (machine propre)

# Suit à la lettre la section « Démarrage local » du README sur un serveur neuf,
# sans dépôt cloné, sans dépendances installées, sans base ni fichier .env.
# Chaque étape est notée (réussie ou bloquée) sans arrêter le parcours.
# Ne touche jamais à la production.
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/guide-demarrage.yml', 'README.md', 'Makefile']

permissions:
  contents: read

jobs:
  guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # « git clone <repo-url> »
      - uses: actions/checkout@v4

      # Prérequis du README : Java 17 et Maven, Node.js 22 et npm, Docker et Docker Compose.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Suivre le guide
        shell: bash
        run: |
          # GitHub lance « shell: bash » avec -e : on le retire pour noter chaque étape jusqu'au bout.
          set +e -u
          RESULTS="$RUNNER_TEMP/resultats.md"
          LOGS="$RUNNER_TEMP/journaux"
          mkdir -p "$LOGS"
          note() { echo "| $1 | $2 | $3 |" >> "$RESULTS"; echo "[$2] $1 — $3"; }
          wait_for() { # url secondes pid : s'arrête dès que le processus attendu s'est terminé
            for _ in $(seq 1 "$2"); do
              curl -fsS -o /dev/null --max-time 5 "$1" 2>/dev/null && return 0
              kill -0 "$3" 2>/dev/null || return 1
              sleep 1
            done
            return 1
          }
          {
            echo "## Test du guide de démarrage sur une machine propre"
            echo
            echo "Exécution du $(date -u '+%d/%m/%Y à %H:%M UTC'), commit \`${GITHUB_SHA::7}\`, serveur GitHub \`ubuntu-24.04\` neuf."
            echo
            echo "Outils : $(java -version 2>&1 | head -1) ; $(mvn -v | head -1) ; Node $(node -v), npm $(npm -v) ; $(docker compose version)."
            echo
            echo "| Étape du guide | Résultat | Détail |"
            echo "|---|---|---|"
          } > "$RESULTS"

          # Terminal 1 : make backend-local
          nohup make backend-local > "$LOGS/backend-local.log" 2>&1 &
          BACK=$!
          if wait_for http://localhost:3000/ready 600 "$BACK"; then
            note "make backend-local (base, Redis, migrations, données, API)" "Réussi" "API prête sur le port 3000"
          elif ! kill -0 "$BACK" 2>/dev/null; then
            note "make backend-local (base, Redis, migrations, données, API)" "Bloqué" "Arrêt : $(grep -m1 -iE 'error|erreur|exception|missing|introuvable|not found' "$LOGS/backend-local.log" | cut -c1-180 | tr '|' '/')"
          else
            note "make backend-local (base, Redis, migrations, données, API)" "Bloqué" "API non prête après 10 minutes"
          fi

          # Terminal 2 : make front-local
          nohup make front-local > "$LOGS/front-local.log" 2>&1 &
          FRONT=$!
          if wait_for http://localhost:4200 420 "$FRONT"; then
            note "make front-local (interface sur http://localhost:4200)" "Réussi" "Interface servie sur le port 4200"
          elif ! kill -0 "$FRONT" 2>/dev/null; then
            note "make front-local (interface sur http://localhost:4200)" "Bloqué" "Arrêt : $(grep -m1 -iE 'error|erreur|not found|introuvable' "$LOGS/front-local.log" | cut -c1-180 | tr '|' '/')"
          else
            note "make front-local (interface sur http://localhost:4200)" "Bloqué" "Interface non servie après 7 minutes"
          fi

          # Comptes de démonstration : mot de passe = SEED_DEFAULT_PASSWORD de l'environnement local
          PASSWORD="$(grep -E '^SEED_DEFAULT_PASSWORD=' database/.env 2>/dev/null | cut -d= -f2- | tr -d '"')"
          if [ -z "$PASSWORD" ]; then
            note "Connexion avec un compte de démonstration" "Bloqué" "SEED_DEFAULT_PASSWORD absent de database/.env"
          else
            CODE="$(curl -s --max-time 30 -o "$LOGS/login.json" -w '%{http_code}' -X POST http://localhost:4200/api/v1/auth/login \
              -H 'Content-Type: application/json' -H 'Origin: http://localhost:4200' \
              -d "{\"email\":\"superadmin@kafountine.gouv.sn\",\"password\":\"$PASSWORD\"}")"
            if [ "$CODE" = 200 ]; then
              note "Connexion avec un compte de démonstration" "Réussi" "superadmin@kafountine.gouv.sn connecté via l'interface (HTTP 200)"
            else
              note "Connexion avec un compte de démonstration" "Bloqué" "HTTP $CODE"
            fi
          fi

          cat "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
          kill "$BACK" "$FRONT" 2>/dev/null || true
          make down-dev > /dev/null 2>&1 || true
          # Échec du job si une étape du guide a bloqué.
          ! grep -q '| Bloqué |' "$RESULTS"

      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-demarrage-journaux
          path: ${{ runner.temp }}/journaux
          retention-days: 30
