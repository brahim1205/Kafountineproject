  <div class="bg-white rounded-xl p-6 border border-gray-200">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h3 class="text-lg font-semibold text-gray-900">Évolution des recettes</h3>
        <p class="text-sm text-gray-600 mt-1">Recettes hebdomadaires</p>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
          <span class="text-xs text-gray-600">Recettes</span>
        </div>
      </div>
    </div>
    <div class="space-y-4">
      @for (item of data(); track index; let index = $index) {
        <div class="flex items-center gap-3">
          <span class="text-xs font-medium text-gray-600 w-8">{{ item.day }}</span>
          <div class="flex-1 bg-gray-100 rounded-full h-8 relative overflow-hidden">
            <div class="absolute inset-y-0 left-0 bg-gradient-to-r from-emerald-500 to-emerald-400 rounded-full transition-all duration-500" [style.width]="`${Math.min((item.amount / maxAmount()) * 100, 100)}%`"></div>
          </div>
          <span class="text-xs font-semibold text-gray-900 w-24 text-right">{{ (item.amount / 1000000).toFixed(2) }}M</span>
        </div>
      }
    </div>
    <div class="mt-6 pt-6 border-t border-gray-200">
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-600">Total hebdomadaire</span>
        <span class="text-lg font-bold text-gray-900">14 400 000 FCFA</span>
      </div>
    </div>
  </div>
