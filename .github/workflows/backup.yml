name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'kafontine' }}
  POSTGRES_SELECTOR: ${{ secrets.POSTGRES_SELECTOR || 'app.kubernetes.io/instance=kafontine,app.kubernetes.io/name=postgresql' }}

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_DATA}" | base64 -d > "$HOME/.kube/config"
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Export database backup
        run: |
          POD_NAME="$(kubectl get pods -n "${K8S_NAMESPACE}" -l "${POSTGRES_SELECTOR}" -o jsonpath='{.items[0].metadata.name}')"
          test -n "${POD_NAME}"
          kubectl exec -n "${K8S_NAMESPACE}" "${POD_NAME}" -- sh -lc 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "kafontine_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.dump"

      - name: Upload backup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: kafontine_${{ github.run_id }}_${{ github.run_attempt }}.dump
          retention-days: 30
