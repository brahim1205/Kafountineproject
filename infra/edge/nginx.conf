# Proxy frontal partagé du serveur : seul détenteur des ports 80 et 443.
# Il ne fait que répartir le trafic ; chaque site garde sa propre configuration :
#   - c2p.sn : TLS de bout en bout chez c2p (certificats et renouvellement inchangés),
#     relayé tel quel (ssl_preread) avec l'adresse du client (PROXY protocol) ;
#   - orbyteconsulting.tech (Kafountine) : TLS terminé ici, voir sites/kafontine.conf.
# Aucun déploiement de c2p ni de Kafountine ne modifie ce dossier (/opt/edge).

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

stream {
  # Résolution au fil de l'eau : un conteneur c2p recréé change d'adresse IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $ssl_preread_server_name $tls_site {
    orbyteconsulting.tech      127.0.0.1:8444;
    www.orbyteconsulting.tech  127.0.0.1:8444;
    # Tout le reste (c2p.sn, www.c2p.sn, sonar.c2p.sn…) : comme avant la séparation.
    default                    c2p-proxy:8444;
  }

  server {
    listen 8443;
    ssl_preread on;
    proxy_pass $tls_site;
    proxy_protocol on;
    proxy_connect_timeout 5s;
  }
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format edge '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent $request_time';
  access_log /dev/stdout edge;
  error_log /dev/stderr warn;

  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  include /etc/nginx/sites/*.conf;

  # Port 80 des autres domaines (c2p) : relayé à c2p, qui sert ses défis ACME et ses redirections.
  server {
    listen 8080 default_server;
    server_name _;

    location / {
      set $c2p_http http://c2p-proxy:8080;
      proxy_pass $c2p_http;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto http;
    }
  }
}
