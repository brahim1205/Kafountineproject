name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: Existing Docker image tag (full commit SHA)
        required: true
      reason:
        description: Reason for rollback
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      APP_DIR: ${{ vars.APP_DIR || '/opt/kafontine' }}
      DOCKER_REGISTRY: ghcr.io
      IMAGE_NAME: brahim1205/kafontine
      DOCKER_USERNAME: ${{ github.actor }}
      DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      TARGET_VERSION: ${{ inputs.target_version }}
      HEALTH_URL: ${{ secrets.HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate rollback configuration
        run: |
          set -euo pipefail
          [[ "$APP_DIR" =~ ^/[a-zA-Z0-9/_-]+$ ]]
          [[ "$DOCKER_REGISTRY" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]
          [[ "$DOCKER_USERNAME" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$IMAGE_NAME" =~ ^[a-z0-9][a-z0-9/_-]*$ ]]
          [[ "$TARGET_VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
          test -n "$DOCKER_PASSWORD"
          test -n "$HEALTH_URL"
      - uses: ./.github/actions/production-ssh
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Back up and restore application images
        run: |
          set -euo pipefail
          printf '%s' "$DOCKER_PASSWORD" | ssh kafontine-production "docker login '$DOCKER_REGISTRY' -u '$DOCKER_USERNAME' --password-stdin"
          ssh kafontine-production "bash -s -- '$APP_DIR' 'pre_rollback_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.dump'" < scripts/backup-production.sh
          ssh kafontine-production "bash -s -- '$APP_DIR' '$DOCKER_REGISTRY/$IMAGE_NAME-backend:$TARGET_VERSION' '$DOCKER_REGISTRY/$IMAGE_NAME-frontend:$TARGET_VERSION' rollback" < scripts/deploy-images.sh
      - name: Verify public readiness
        run: curl -fsS --max-time 60 "$HEALTH_URL"
      - name: Record rollback result
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          RESULT: ${{ job.status }}
        run: |
          printf 'Rollback: %s\nVersion: %s\nReason: %s\n' "$RESULT" "$TARGET_VERSION" "$REASON" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/kafontine_actions
