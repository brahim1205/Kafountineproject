  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-md">
      <div class="p-6 border-b border-gray-200">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold text-gray-900">Détails du Pêcheur</h3>
          <button (click)="closed.emit()" class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg">
            <i class="ri-close-line text-xl"></i>
          </button>
        </div>
      </div>
      <div class="p-6 space-y-3">
        <div class="flex justify-between">
          <span class="text-gray-500">Nom:</span>&ngsp;<span class="font-medium">{{ item().nom }}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-500">Prénom:</span>&ngsp;<span class="font-medium">{{ item().prenom }}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-500">Téléphone:</span>&ngsp;<span class="font-medium">{{ item().telephone || '-' }}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-500">NIN:</span>&ngsp;<span class="font-medium">{{ item().nin || '-' }}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-500">Adresse:</span>&ngsp;<span class="font-medium">{{ item().adresse || '-' }}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-500">Statut:</span>&ngsp;<span class="font-medium">{{ item().statut }}</span>
        </div>
      </div>
      <div class="p-6 border-t border-gray-200 flex justify-end">
        <button (click)="closed.emit()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200">Fermer</button>
      </div>
    </div>
  </div>
