name: Deploy Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}
  IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME || 'kafontine' }}
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE || 'kafontine' }}
  HELM_RELEASE: ${{ secrets.HELM_RELEASE || 'kafontine' }}
  BACKEND_DEPLOYMENT: ${{ secrets.BACKEND_DEPLOYMENT || 'kafontine-backend' }}
  FRONTEND_DEPLOYMENT: ${{ secrets.FRONTEND_DEPLOYMENT || 'kafontine-frontend' }}

permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            front/package-lock.json

      - name: Validate production environment template
        run: bash ./scripts/validate-prod-env.sh --allow-placeholders .env.prod.example

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: front

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: front

  build-and-push:
    runs-on: ubuntu-latest
    needs: security-scan
    timeout-minutes: 30
    outputs:
      enabled: ${{ steps.registry-check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Check registry credentials
        id: registry-check
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "${DOCKER_USERNAME}" ] && [ -n "${DOCKER_PASSWORD}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker registry credentials are not configured. Skipping build-and-push."
          fi

      - name: Set up Docker Buildx
        if: steps.registry-check.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        if: steps.registry-check.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        if: steps.registry-check.outputs.enabled == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        if: steps.registry-check.outputs.enabled == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request' && needs.build-and-push.outputs.enabled == 'true'
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment prerequisites
        id: deploy-check
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          if [ -n "${KUBE_CONFIG_DATA}" ] && [ -n "${HEALTH_URL}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets are incomplete. Skipping deploy job."
          fi

      - name: Setup kubectl
        if: steps.deploy-check.outputs.enabled == 'true'
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup Helm
        if: steps.deploy-check.outputs.enabled == 'true'
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        if: steps.deploy-check.outputs.enabled == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_DATA}" | base64 -d > "$HOME/.kube/config"
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Deploy with Helm
        if: steps.deploy-check.outputs.enabled == 'true'
        run: |
          helm upgrade --install "${HELM_RELEASE}" infra/helm/kafontine \
            --namespace "${K8S_NAMESPACE}" \
            --create-namespace \
            --set frontend.image.repository="${DOCKER_REGISTRY}/${IMAGE_NAME}-frontend" \
            --set frontend.image.tag="${GITHUB_SHA}" \
            --set backend.image.repository="${DOCKER_REGISTRY}/${IMAGE_NAME}-backend" \
            --set backend.image.tag="${GITHUB_SHA}"
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Wait for rollout
        if: steps.deploy-check.outputs.enabled == 'true'
        run: |
          kubectl rollout status deployment/"${BACKEND_DEPLOYMENT}" -n "${K8S_NAMESPACE}" --timeout=180s
          kubectl rollout status deployment/"${FRONTEND_DEPLOYMENT}" -n "${K8S_NAMESPACE}" --timeout=180s

      - name: Health Check
        if: steps.deploy-check.outputs.enabled == 'true'
        run: |
          curl -f --max-time 60 "${HEALTH_URL}"
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}

      - name: Notify deployment
        if: always() && steps.deploy-check.outputs.enabled == 'true'
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Deployment ${{ job.status }} for Kafontine",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Deployment *${{ job.status }}* for Kafontine Municipal\nVersion: `${{ github.sha }}`\nEnvironment: Production"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
